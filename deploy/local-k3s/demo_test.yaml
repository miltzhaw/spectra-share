# =============================================================================
# Flowcept PROV-AGENT FastAPI script — mounted as /scripts/prov_api.py
# Using a ConfigMap avoids heredoc YAML escaping issues.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: flowcept-prov-api
  namespace: openlit-demo
data:
  consumer.py: |
    import os
    import json
    import time
    import redis
    from pymongo import MongoClient

    print("LOG [Consumer]: Initializing direct Redis-to-MongoDB pipeline...", flush=True)
    r_client = redis.Redis(host="flowcept-redis", port=6379, decode_responses=True)
    m_client = MongoClient(host="flowcept-mongodb", port=27017)
    db = m_client["flowcept"]
    collection = db["tasks"]

    print("LOG [Consumer]: System ready. Monitoring queue 'interception'...", flush=True)

    while True:
        try:
            packed_data = r_client.blpop("interception", timeout=2)
            if packed_data:
                queue_name, raw_json = packed_data
                task_dict = json.loads(raw_json)
                
                # Normalize status for the Flowcept UI tracking chart match patterns
                current_status = task_dict.get("status", "").upper()
                if current_status in ["SUCCESS", "SUBMITTED"]:
                    task_dict["status"] = "FINISHED"
                elif current_status == "RUNNING":
                    task_dict["status"] = "RUNNING"
                
                collection.insert_one(task_dict)
        except Exception as e:
            print(f"LOG ERROR [Consumer]: {e}", flush=True)
            time.sleep(1)
            
  rest_api.py: |
    import os
    import time
    import copy
    from fastapi import FastAPI, Request
    from fastapi.middleware.cors import CORSMiddleware
    from pydantic import BaseModel
    from pymongo import MongoClient

    app = FastAPI()

    app.add_middleware(
        CORSMiddleware,
        allow_origins=["*"],
        allow_credentials=True,
        allow_methods=["*"],
        allow_headers=["*"],
    )

    class UIQueryRequest(BaseModel):
        question: str

    def db():
        c = MongoClient(os.getenv("MONGO_HOST","flowcept-mongodb"), int(os.getenv("MONGO_PORT","27017")))
        return c["flowcept"]

    @app.get("/")
    def root(): return {"status": "ok"}

    @app.get("/health/live")
    def health(): return {"status": "ok"}

    @app.get("/api/v1/api/v1")
    @app.get("/api/v1")
    def ui_base_probe():
        return {"status": "ok", "message": "Flowcept REST API Router"}

    def process_and_format_tasks(raw_tasks):
        processed_tasks = []

        # 0. Records are pre-filtered to ended_at-only by the REST query.
        # No merging needed — each record is already a complete task instance.

        # 1. Force strict chronological order by started_at.
        # Canonical order is used as a tiebreaker for same-agent tasks where
        # timestamps are identical or inverted due to push ordering.
        CANONICAL_ORDER = [
            "agent_a_run",
            "call_llm", "call_agent_c",
            "agent_c_run",
        ]
        def sort_key(t):
            ts = t.get("started_at") or 0
            act = t.get("activity_id", "")
            order = CANONICAL_ORDER.index(act) if act in CANONICAL_ORDER else 99
            return (ts, order)
        sorted_tasks = sorted(raw_tasks, key=sort_key)
        
        resolved_ids = []

        for i, raw_task in enumerate(sorted_tasks):
            task = copy.deepcopy(raw_task)
            activity = task.get("activity_id", f"task_{i}")
            
            task["activity_id"] = activity
            task["task_id"] = task.get("task_id", activity)
            task["variant_id"] = task.get("variant_id", activity)
            if not task.get("workflow_id"):
                task.pop("workflow_id", None)

            # Extract Swimlane Agent Groups
            metadata = task.get("custom_metadata", {})
            agent_label = "agent-system"
            if isinstance(metadata, dict):
                agent_label = metadata.get("agent", "agent-system")
            elif task.get("agent"):
                agent_label = task.get("agent")
            
            task["agent_name"] = agent_label
            task["agent_id"] = agent_label
            task["agent"] = agent_label

            # Causal lineage routing
            parent_id = None
            if i > 0:
                if "call_agent_b" in activity:
                    parent_id = "agent_a_initiation"
                elif "call_llm" in activity:
                    parent_id = "agent_a_initiation"
                elif "call_agent_c" in activity:
                    parent_id = "call_llm"
                elif "execution_started" in activity:
                    parent_id = "call_agent_c"
                elif "execute_plan_completed" in activity:
                    parent_id = "agent_c_execution_started"
                
                if not parent_id and resolved_ids:
                    parent_id = resolved_ids[-1]

            # Store clean resolution trace
            resolved_ids.append(activity)

            task["parent_task_id"] = parent_id
            task["parent_id"] = parent_id
            task["parent_task_ids"] = [parent_id] if parent_id else []
            task["used"] = [parent_id] if parent_id else []
            task["generated"] = [activity]

            task["status"] = "FINISHED"

            # Safe duration parsing
            try:
                started = float(task.get("started_at", 0)) if task.get("started_at") else 0
                ended = float(task.get("ended_at", 0)) if task.get("ended_at") else 0
            except (ValueError, TypeError):
                started, ended = 0, 0
                
            if ended > started:
                task["duration"] = round(ended - started, 2)
            else:
                task["duration"] = round(0.04 * (i + 1), 2)

            processed_tasks.append(task)
            
        return processed_tasks

    # ─── ROUTE IMPLEMENTATIONS ─────────────────────────────────────────────
    @app.get("/tasks")
    def tasks_fallback_list(limit: int = 50):
        try:
            docs = list(db()["tasks"].find({}, {"_id": 0}).sort("started_at", -1).limit(limit))
            return process_and_format_tasks(docs)
        except Exception:
            return []

    @app.delete("/api/v1/tasks/clear")
    def tasks_clear():
        try:
            result = db()["tasks"].delete_many({})
            return {"deleted": result.deleted_count}
        except Exception as e:
            return {"error": str(e)}, 500

    @app.get("/api/v1/tasks")
    @app.get("/api/v1/api/v1/tasks")
    def tasks_primary_router(limit: int = 200):
        try:
            # Fetch only COMPLETED records (ended_at present) sorted ascending.
            # Init-only records (no ended_at) are noise — they have no duration and
            # are already covered by the completion record from the same task instance.
            # 50 records = ~8 full runs of 6 tasks each, plenty for the run selector.
            docs = list(db()["tasks"].find(
                {"ended_at": {"$exists": True, "$ne": None}},
                {"_id": 0}
            ).sort("started_at", 1).limit(limit))
            formatted = process_and_format_tasks(docs)
            completed_count = sum(1 for t in formatted if t["status"] == "FINISHED")
            error_count = sum(1 for t in formatted if t["status"] == "ERROR")
            
            return {
                "tasks": formatted,
                "total": len(formatted),
                "completed": completed_count,
                "errors": error_count
            }
        except Exception as e:
            print(f"Error packing endpoint metrics: {e}")
            return {"tasks": [], "total": 0, "completed": 0, "errors": 0}

    @app.get("/api/v1/workflows")
    @app.get("/api/v1/api/v1/workflows")
    def workflows():
        return {"workflows": [{"workflow_id": "workflow_alpha", "name": "Agentic Multi-Agent Lineage Tree"}], "total": 1}

    @app.get("/api/v1/objects")
    @app.get("/api/v1/api/v1/objects")
    def objects(limit: int = 50):
        try: objs = list(db()["objects"].find({}, {"_id": 0}).limit(limit))
        except Exception: objs = []
        return {"objects": objs, "total": len(objs)}

    @app.get("/api/v1/tasks/{task_id}")
    @app.get("/api/v1/api/v1/tasks/{task_id}")
    def get_task(task_id: str):
        doc = db()["tasks"].find_one({"task_id": task_id}, {"_id": 0})
        if doc:
            formatted = process_and_format_tasks([doc])
            return formatted[0]
        return {"error": "not found"}

    # --- NATURAL LANGUAGE QUERY ROUTER ---
    @app.post("/query")
    @app.post("/api/v1/query")
    @app.post("/api/v1/api/v1/query")
    async def query_handler(request: Request):
        try: body = await request.json()
        except Exception: return {"status": "error", "response": "Invalid JSON payload."}

        question = body.get("question", "").lower()
        d = db()
        try:
            if any(w in question for w in ["fail", "error"]):
                docs = list(d["tasks"].find({"status":"ERROR"},{"_id":0}).limit(20))
                if not docs:
                    docs = list(d["tasks"].find({"exception":{"$exists":True}},{"_id":0}).limit(20))
                if docs:
                    summaries = [{"activity": t.get("activity_id","?"), "agent": t.get("custom_metadata",{}).get("agent","?") if isinstance(t.get("custom_metadata"),dict) else "?", "exception": t.get("exception","n/a"), "used": t.get("used",{})} for t in docs]
                    msg = f"Found {len(docs)} failed tasks: {summaries}"
                else:
                    msg = "Found 0 failed tasks."
                return {"status": "success", "response": msg, "answer": msg, "tasks": docs}
            elif any(w in question for w in ["longest", "slowest", "duration", "average"]):
                pipeline = [
                    {"$match": {"started_at":{"$exists":True},"ended_at":{"$exists":True}}},
                    {"$project": {
                        "agent": {"$ifNull": ["$custom_metadata.agent", "$agent"]},
                        "duration": {"$subtract": ["$ended_at", "$started_at"]}
                    }},
                    {"$group": {"_id": "$agent", "avg_s": {"$avg": "$duration"}, "max_s": {"$max": "$duration"}, "count": {"$sum":1}}},
                    {"$sort": {"avg_s":-1}}
                ]
                res = list(d["tasks"].aggregate(pipeline))
                for r in res:
                    r["avg_s"] = round(r.get("avg_s", 0), 3)
                    r["max_s"] = round(r.get("max_s", 0), 3)
                msg = f"Telemetry verified. Averages per agent lane profile: {res}"
                return {"status": "success", "response": msg, "answer": msg, "data": res}
            elif any(w in question for w in ["input", "used", "receive", "prompt", "llm input"]):
                activity = "call_llm"
                if "call_agent" in question:
                    activity = "call_agent_c"
                docs = list(d["tasks"].find({"activity_id": activity},{"_id":0}).sort("started_at",-1).limit(5))
                if docs:
                    summaries = []
                    for t in docs:
                        summaries.append({"activity": t.get("activity_id"), "agent": t.get("custom_metadata",{}).get("agent","?") if isinstance(t.get("custom_metadata"),dict) else "?", "used": t.get("used",{}), "duration_s": round((t.get("ended_at",0) or 0)-(t.get("started_at",0) or 0),2)})
                    msg = f"Last {len(docs)} '{activity}' tasks received these inputs: {summaries}"
                else:
                    msg = f"No tasks found with activity_id='{activity}'."
                return {"status": "success", "response": msg, "answer": msg}
            elif any(w in question for w in ["last run", "latest run", "recent run", "last workflow", "how many tasks"]):
                all_tasks = list(d["tasks"].find({"started_at":{"$exists":True}},{"_id":0}).sort("started_at",-1).limit(200))
                if not all_tasks:
                    return {"status": "success", "response": "No tasks found.", "answer": "No tasks found."}
                # Group by workflow_id first (reliable for both base demo and LangGraph).
                # Fall back to timestamp proximity only for tasks without workflow_id.
                latest_wf = all_tasks[0].get("workflow_id")
                if latest_wf:
                    run_tasks = [t for t in all_tasks if t.get("workflow_id") == latest_wf]
                else:
                    latest_start = all_tasks[0].get("started_at", 0)
                    # Use a wide window — LangGraph runs can span several minutes
                    run_tasks = [t for t in all_tasks if abs(t.get("started_at",0) - latest_start) < 600]
                agents = {}
                activities = []
                for t in run_tasks:
                    ag = t.get("custom_metadata",{}).get("agent","?") if isinstance(t.get("custom_metadata"),dict) else t.get("agent","?")
                    agents[ag] = agents.get(ag, 0) + 1
                    act = t.get("activity_id","?")
                    if act not in activities:
                        activities.append(act)
                framework = all_tasks[0].get("custom_metadata",{}).get("framework","") if isinstance(all_tasks[0].get("custom_metadata"),dict) else ""
                wf_label = f" (workflow_id: {latest_wf})" if latest_wf else ""
                msg = (f"Last run{wf_label} had {len(run_tasks)} tasks across agents: {agents}. "
                       f"Activities executed: {activities}."
                       + (f" Framework: {framework}." if framework else ""))
                return {"status": "success", "response": msg, "answer": msg}
            elif any(w in question for w in ["count", "total", "how many", "number of"]):
                total = d["tasks"].count_documents({})
                by_agent_pipeline = [
                    {"$project": {"agent": {"$ifNull": ["$custom_metadata.agent","$agent","unknown"]}}},
                    {"$group": {"_id": "$agent", "count": {"$sum": 1}}}
                ]
                by_agent = {r["_id"]: r["count"] for r in d["tasks"].aggregate(by_agent_pipeline)}
                msg = f"Total tasks in MongoDB: {total}. By agent: {by_agent}"
                return {"status": "success", "response": msg, "answer": msg}
            else:
                total = d["tasks"].count_documents({})
                msg = f"Total tasks: {total}. Try: 'which agent took longest', 'what inputs did call_llm receive', 'show failed tasks', 'how many tasks ran in the last run'."
                return {"status": "success", "response": msg, "answer": msg}
        except Exception as e:
            return {"status": "error", "response": f"Internal query computation failure: {str(e)}"}
  start.sh: |
    #!/bin/sh
    echo "LOG: Bootstrapping Flowcept Unified Pipeline..."
    pip install --no-cache-dir redis pymongo fastapi uvicorn
    
    # Create a dedicated app directory to avoid root scope issues
    mkdir -p /app
    cp /scripts/consumer.py /app/consumer.py
    cp /scripts/rest_api.py /app/rest_api.py
    
    # Start the background consumer process
    python3 -u /app/consumer.py > /var/log/consumer.log 2>&1 &
    
    echo "LOG: Starting Unified REST & Query Engine on port 8000..."
    exec uvicorn rest_api:app --app-dir /app --host 0.0.0.0 --port 8000
---
# =============================================================================
# Flowcept Consumer — reads Redis interception channel, writes to MongoDB
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flowcept-consumer
  namespace: openlit-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flowcept-consumer
  template:
    metadata:
      labels:
        app: flowcept-consumer
    spec:
      containers:
        - name: flowcept-consumer
          image: python:3.11-slim
          command: ["/bin/sh", "-c"]
          args:
            - |
              pip install --no-cache-dir py-cpuinfo pymongo redis pandas numpy && pip install --no-cache-dir "flowcept[mongo]" &&
              cp /scripts/consumer.py /consumer.py && python3 /consumer.py
          env:
            # FIX: Force the consumer to see the exact same settings path as the agents
            - name: FLOWCEPT_SETTINGS_PATH
              value: "/root/.flowcept/settings.yaml"
            - name: MQ_ENABLED
              value: "true"
            - name: MQ_TYPE
              value: "redis"
            - name: MQ_HOST
              value: "flowcept-redis"
            - name: MQ_PORT
              value: "6379"
            - name: MONGO_ENABLED
              value: "true"
            - name: MONGO_HOST
              value: "flowcept-mongodb"
            - name: MONGO_PORT
              value: "27017"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          volumeMounts:
            - name: flowcept-cfg
              mountPath: /root/.flowcept
            - name: prov-api-script
              mountPath: /scripts
      volumes:
        - name: flowcept-cfg
          configMap:
            name: flowcept-settings
        - name: prov-api-script
          configMap:
            name: flowcept-prov-api

---
# =============================================================================
# Flowcept PROV-AGENT — natural-language provenance query server (port 8095)
#
# Port-forward: kubectl port-forward svc/flowcept-agent -n openlit-demo 8010:8000
# Query: curl -s -X POST http://localhost:5000/query \
#              -H "Content-Type: application/json" \
#              -d '{"question": "which agent took longest?"}'
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flowcept-agent
  namespace: openlit-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flowcept-agent
  template:
    metadata:
      labels:
        app: flowcept-agent
    spec:
      containers:
        - name: flowcept-agent
          image: python:3.11-slim
          command: ["/bin/sh", "-c"]
          args:
            - |
              pip install --no-cache-dir fastapi uvicorn py-cpuinfo pymongo redis gitpython && pip install --no-cache-dir "flowcept[mongo,llm_agent]" &&
              cp /scripts/start.sh /start.sh && chmod +x /start.sh &&
              /start.sh
          ports:
            - name: unified-api
              containerPort: 8000
          env:
            # Fixes the ValueError by forcing Flowcept out of offline caching mode
            - name: FLOWCEPT_DB_FLUSH_MODE
              value: "online"
            # Ensures core instrumentation engine attaches cleanly to the services
            - name: FLOWCEPT_SETTINGS_PATH
              value: "/root/.flowcept/settings.yaml"
            - name: MQ_ENABLED
              value: "true"
            - name: MQ_TYPE
              value: "redis"
            - name: MQ_HOST
              value: "flowcept-redis"
            - name: MQ_PORT
              value: "6379"
            - name: MONGO_ENABLED
              value: "true"
            - name: MONGO_HOST
              value: "flowcept-mongodb"
            - name: MONGO_PORT
              value: "27017"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "300m"
          volumeMounts:
            - name: flowcept-cfg
              mountPath: /root/.flowcept
            - name: prov-api-script
              mountPath: /scripts
      volumes:
        - name: flowcept-cfg
          configMap:
            name: flowcept-settings
        - name: prov-api-script
          configMap:
            name: flowcept-prov-api

---
apiVersion: v1
kind: Service
metadata:
  name: flowcept-agent
  namespace: openlit-demo
spec:
  selector:
    app: flowcept-agent
  ports:
    - name: unified-api
      port: 8000
      targetPort: 8000

---
# =============================================================================
# Flowcept REST API — read-only structured query API with Swagger UI
#
# Endpoints: /api/v1/tasks  /api/v1/workflows  /api/v1/objects
# Swagger UI: http://localhost:5000/docs  (after port-forward)
# Port-forward: kubectl port-forward svc/flowcept-rest -n openlit-demo 5000:5000
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flowcept-rest
  namespace: openlit-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flowcept-rest
  template:
    metadata:
      labels:
        app: flowcept-rest
    spec:
      containers:
        - name: flowcept-rest
          image: python:3.11-slim
          command: ["/bin/sh", "-c"]
          args:
            - |
              pip install --no-cache-dir fastapi uvicorn pymongo &&
              cp /scripts/rest_api.py /rest_api.py &&
              uvicorn rest_api:app --host 0.0.0.0 --port 5000
          ports:
            - name: rest-api
              containerPort: 5000
          env:
            - name: MONGO_ENABLED
              value: "true"
            - name: MONGO_HOST
              value: "flowcept-mongodb"
            - name: MONGO_PORT
              value: "27017"
            - name: MQ_ENABLED
              value: "true"
            - name: MQ_TYPE
              value: "redis"
            - name: MQ_HOST
              value: "flowcept-redis"
            - name: MQ_PORT
              value: "6379"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "300m"
          volumeMounts:
            - name: flowcept-cfg
              mountPath: /root/.flowcept
            - name: prov-api-script
              mountPath: /scripts
      volumes:
        - name: flowcept-cfg
          configMap:
            name: flowcept-settings
        - name: prov-api-script
          configMap:
            name: flowcept-prov-api

---
apiVersion: v1
kind: Service
metadata:
  name: flowcept-rest
  namespace: openlit-demo
spec:
  selector:
    app: flowcept-rest
  ports:
    - name: rest-api
      port: 5000
      targetPort: 5000

---
# =============================================================================
# Flowcept UI — Provenance Dashboard (serves the React-based UI on port 8020)
#
# Self-contained HTML dashboard that connects to flowcept-agent:8095 (PROV-AGENT)
# and flowcept-rest:5000 (REST API) from inside the cluster, or via port-forwards
# when accessed from the host browser.
#
# Port-forward: kubectl port-forward svc/flowcept-ui -n openlit-demo 8020:8020
# Open: http://localhost:8020
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: flowcept-ui-html
  namespace: openlit-demo
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flowcept Provenance Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.11.0/dist/tabler-icons.min.css">
    <style>
      *{box-sizing:border-box;margin:0;padding:0}
      :root{--bg:#ffffff;--bg2:#f8f9fa;--bg3:#f1f3f5;--text:#1a1a2e;--text2:#6c757d;--text3:#adb5bd;
        --border:#dee2e6;--blue:#378add;--green:#1D9E75;--amber:#EF9F27;--red:#E24B4A;--purple:#534AB7;
        --font:'Inter',-apple-system,sans-serif;--mono:'JetBrains Mono','Fira Code',monospace;--radius:8px}
      @media(prefers-color-scheme:dark){:root{--bg:#16161e;--bg2:#1e1e2e;--bg3:#252535;--text:#cdd6f4;
        --text2:#9399b2;--text3:#6c7086;--border:#313244}}
      body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;height:100vh;display:flex;flex-direction:column}
      .topbar{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--bg);flex-shrink:0}
      .logo{font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px}
      .logo-icon{width:24px;height:24px;background:var(--purple);border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px}
      .badge{font-size:11px;padding:2px 8px;border-radius:99px;font-weight:500}
      .badge-live{background:#d4edda;color:#155724}.badge-err{background:#f8d7da;color:#721c24}.badge-idle{background:var(--bg3);color:var(--text2)}
      @media(prefers-color-scheme:dark){.badge-live{background:#1e3a2b;color:#75d9a0}.badge-err{background:#3a1e1e;color:#f98c8c}.badge-idle{background:var(--bg3);color:var(--text2)}}
      .top-inputs{display:flex;gap:6px;margin-left:auto;align-items:center}
      .top-inputs input{font-size:12px;padding:5px 9px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg2);color:var(--text);width:220px}
      .top-inputs input:focus{outline:none;border-color:var(--blue)}
      .btn{font-size:12px;padding:5px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg2);color:var(--text);cursor:pointer;display:flex;align-items:center;gap:4px}
      .btn:hover{background:var(--bg3)}.btn-primary{background:var(--blue);color:#fff;border-color:var(--blue)}.btn-primary:hover{opacity:.9}
      .main{display:grid;grid-template-columns:1fr 340px;flex:1;overflow:hidden}
      .left{display:flex;flex-direction:column;overflow:hidden;border-right:1px solid var(--border)}
      .tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0}
      .tab{padding:9px 16px;font-size:13px;cursor:pointer;border-bottom:2px solid transparent;color:var(--text2);white-space:nowrap}
      .tab.active{color:var(--text);border-bottom-color:var(--blue);font-weight:500}
      .tab-actions{margin-left:auto;display:flex;align-items:center;padding-right:8px;gap:6px}
      .panel{flex:1;overflow-y:auto;padding:14px 16px}
      .metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
      .metric{background:var(--bg2);border-radius:var(--radius);padding:10px 12px;border:1px solid var(--border)}
      .metric-lbl{font-size:11px;color:var(--text2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
      .metric-val{font-size:22px;font-weight:600}
      .val-ok{color:var(--green)}.val-err{color:var(--red)}.val-warn{color:var(--amber)}
      .sec{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text2);margin-bottom:8px}
      .task-list{display:flex;flex-direction:column;gap:3px}
      .task-row{display:grid;grid-template-columns:12px 1fr auto 56px;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius);font-size:12px;cursor:pointer;border:1px solid transparent}
      .task-row:hover{background:var(--bg2)}.task-row.sel{background:var(--bg2);border-color:var(--border)}
      .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
      .dot-ok{background:var(--green)}.dot-err{background:var(--red)}.dot-run{background:var(--amber)}
      .task-info{overflow:hidden}.task-name{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
      .task-sub{font-size:11px;color:var(--text2)}
      .dur{font-size:11px;color:var(--text2);text-align:right;white-space:nowrap}
      .bar-bg{height:3px;background:var(--bg3);border-radius:2px;overflow:hidden;margin-top:2px}
      .bar-fill{height:100%;border-radius:2px}
      .bar-ok{background:var(--green)}.bar-err{background:var(--red)}.bar-run{background:var(--amber)}
      .prov-area{padding:12px}
      .right{display:flex;flex-direction:column;overflow:hidden}
      .detail{flex:0 0 auto;padding:12px 14px;border-bottom:1px solid var(--border);max-height:220px;overflow-y:auto}
      .detail h3{font-size:13px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:6px}
      .kv-grid{display:grid;grid-template-columns:85px 1fr;gap:2px 8px;font-size:12px}
      .kv-k{color:var(--text2);padding:2px 0}.kv-v{padding:2px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono);font-size:11px}
      .kv-tag{font-family:var(--font);background:var(--bg3);border-radius:4px;padding:1px 6px;font-size:11px}
      .chat-section{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0}
      .chat-header{padding:9px 14px;font-size:12px;font-weight:600;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px;flex-shrink:0}
      .quick{display:flex;flex-wrap:wrap;gap:4px;padding:8px 12px;border-bottom:1px solid var(--border);flex-shrink:0}
      .qbtn{font-size:11px;padding:3px 9px;border-radius:99px;border:1px solid var(--border);background:var(--bg2);color:var(--text2);cursor:pointer;white-space:nowrap}
      .qbtn:hover{background:var(--bg3);color:var(--text)}
      .msgs{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-height:0}
      .msg{max-width:88%;padding:8px 11px;border-radius:var(--radius);font-size:12px;line-height:1.55}
      .msg-user{align-self:flex-end;background:var(--blue);color:#fff}
      .msg-agent{align-self:flex-start;background:var(--bg2);border:1px solid var(--border)}
      .msg-loading{opacity:.6;font-style:italic}
      .input-row{display:flex;gap:6px;padding:8px 12px;border-top:1px solid var(--border);flex-shrink:0}
      .input-row input{flex:1;font-size:12px;padding:7px 10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg2);color:var(--text)}
      .input-row input:focus{outline:none;border-color:var(--blue)}
      .empty{text-align:center;padding:48px 16px;color:var(--text3)}
      .empty i{font-size:32px;display:block;margin-bottom:10px}
      svg text{font-family:var(--font)}
      pre{font-family:var(--mono);font-size:11px;white-space:pre-wrap;word-break:break-all}
      .wf-row{display:grid;grid-template-columns:1fr auto auto;gap:8px;padding:8px 10px;border-radius:var(--radius);font-size:12px;cursor:pointer;border:1px solid transparent}
      .wf-row:hover{background:var(--bg2)}
    </style>
    </head>
    <body>
    <div class="topbar">
      <div class="logo"><div class="logo-icon"><i class="ti ti-share-3" aria-hidden="true"></i></div>Flowcept Provenance</div>
      <span class="badge badge-idle" id="badge">● idle</span>
      <div class="top-inputs">
        <input id="rest-url" value="http://localhost:5000/api/v1" placeholder="REST API"/>
        <input id="agent-url" value="http://localhost:5000" placeholder="PROV-AGENT" style="width:180px"/>
        <button class="btn btn-primary" onclick="connect()"><i class="ti ti-plug" aria-hidden="true"></i> Connect</button>
      </div>
    </div>
    <div class="main">
      <div class="left">
        <div class="tabs">
          <div class="tab active" onclick="switchTab('tasks',this)">Tasks</div>
          <div class="tab" onclick="switchTab('graph',this)">Prov graph</div>
          <div class="tab" onclick="switchTab('workflows',this)">Workflows</div>
          <div class="tab-actions">
            <button class="btn" onclick="refresh()" title="Refresh"><i class="ti ti-refresh" aria-hidden="true"></i></button>
            <button class="btn" onclick="clearDB()" title="Clear all tasks from MongoDB" style="opacity:0.6"><i class="ti ti-trash" aria-hidden="true"></i></button>
          </div>
        </div>
        <div class="panel" id="panel-tasks">
          <div class="metrics">
            <div class="metric"><div class="metric-lbl">Total tasks</div><div class="metric-val" id="m-total">—</div></div>
            <div class="metric"><div class="metric-lbl">Completed</div><div class="metric-val val-ok" id="m-ok">—</div></div>
            <div class="metric"><div class="metric-lbl">Errors</div><div class="metric-val val-err" id="m-err">—</div></div>
            <div class="metric"><div class="metric-lbl">Avg duration</div><div class="metric-val" id="m-avg">—</div></div>
          </div>
          <div class="sec">Recent tasks</div>
          <div class="task-list" id="task-list"><div class="empty"><i class="ti ti-database-off"></i>Connect to load tasks</div></div>
        </div>
        <div class="panel" id="panel-graph" style="display:none">
          <div class="sec" style="margin-bottom:12px">W3C PROV lineage graph</div>
          <div class="prov-area" style="overflow:auto;max-height:calc(100vh - 140px)"><svg id="prov-svg" width="100%" xmlns="http://www.w3.org/2000/svg">
            <text x="300" y="140" text-anchor="middle" font-size="13" fill="#adb5bd">Connect and load tasks to render graph</text>
          </svg></div>
        </div>
        <div class="panel" id="panel-workflows" style="display:none">
          <div class="sec">Workflows</div>
          <div id="wf-list"><div class="empty"><i class="ti ti-sitemap"></i>No workflows loaded</div></div>
        </div>
      </div>
      <div class="right">
        <div class="detail">
          <h3><i class="ti ti-info-circle" aria-hidden="true"></i>Task detail</h3>
          <div id="detail-body" style="color:var(--text3);font-size:12px">Select a task to inspect</div>
        </div>
        <div class="chat-section">
          <div class="chat-header"><i class="ti ti-robot" aria-hidden="true"></i>PROV-AGENT</div>
          <div class="quick">
            <button class="qbtn" onclick="q('which agent took longest on average?')">slowest agent?</button>
            <button class="qbtn" onclick="q('how many tasks ran?')">task count?</button>
            <button class="qbtn" onclick="q('show failed tasks and their inputs')">failures?</button>
            <button class="qbtn" onclick="q('what inputs did call_llm receive?')">llm inputs?</button>
            <button class="qbtn" onclick="q('generate_workflow_provenance_card')">prov card</button>
          </div>
          <div class="msgs" id="msgs">
            <div class="msg msg-agent">Connect the PROV-AGENT above, then ask anything about your workflow provenance.</div>
          </div>
          <div class="input-row">
            <input id="qin" placeholder="Ask about tasks, agents, inputs, outputs..." onkeydown="if(event.key==='Enter')sendQ()"/>
            <button class="btn btn-primary" onclick="sendQ()"><i class="ti ti-send" aria-hidden="true"></i></button>
          </div>
        </div>
      </div>
    </div>
    <script>
    let restBase='http://localhost:5000/api/v1',agentBase='http://localhost:5000';
    let tasks=[],selId=null,activeTab='tasks';
    function setBadge(txt,cls){const b=document.getElementById('badge');b.textContent=txt;b.className='badge '+cls}
    function switchTab(n,el){
      activeTab=n;
      document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
      el.classList.add('active');
      ['tasks','graph','workflows'].forEach(t=>{
        const p=document.getElementById('panel-'+t);
        if(p)p.style.display=t===n?'':'none';
      });
      if(n==='graph')drawGraph();
      if(n==='workflows')loadWf();
    }
    async function connect(){
      restBase=document.getElementById('rest-url').value.replace(/\/$/,'');
      agentBase=document.getElementById('agent-url').value.replace(/\/$/,'');
      setBadge('● connecting','badge-idle');
      try{
        const r=await fetch(restBase+'/api/v1');
        if(r.ok){setBadge('● connected','badge-live');await refresh();}
        else throw new Error();
      }catch(e){setBadge('● demo mode','badge-err');loadDemo();}
    }
    function loadDemo(){
      const now=Date.now()/1000;
      tasks=[
        {task_id:'t-001',activity_name:'call_agent_b',agent:'agent-a',workflow_name:'multi-agent-demo',started_at:now-13,ended_at:now-10.2,status:'finished',used:{task:'hello from agent-a'},generated:{forwarded:true}},
        {task_id:'t-002',activity_name:'call_llm',agent:'agent-b',workflow_name:'multi-agent-demo',started_at:now-10.1,ended_at:now-7.8,status:'finished',used:{task:'hello from agent-a'},generated:{response:'tinyllama response text...'}},
        {task_id:'t-003',activity_name:'call_agent_c',agent:'agent-b',workflow_name:'multi-agent-demo',started_at:now-7.7,ended_at:now-7.5,status:'finished',used:{plan:'tinyllama response text...'},generated:{forwarded:true}},
        {task_id:'t-004',activity_name:'execute_plan',agent:'agent-c',workflow_name:'multi-agent-demo',started_at:now-7.4,ended_at:now-7.3,status:'finished',used:{plan:'tinyllama response text...'},generated:{result:'executed: tinyllama response text...'}},
        {task_id:'t-005',activity_name:'call_llm',agent:'agent-b',workflow_name:'multi-agent-demo',started_at:now-55,ended_at:now-53.2,status:'error',used:{task:'explain DNS'},exception:'ConnectionError: ollama timeout'},
      ];
      renderTasks();updateMetrics();
    }
    async function clearDB(){
      if(!confirm('Delete ALL tasks from MongoDB? This cannot be undone.'))return;
      try{
        const r=await fetch(restBase+'/api/v1/tasks/clear',{method:'DELETE'});
        if(r.ok){ tasks=[]; _selectedRunIdx=-1; renderTasks();updateMetrics();drawGraph(); }
        else alert('Clear failed: '+r.status);
      }catch(e){alert('Clear failed: '+e);}
    }
    async function refresh(){
      try{
        const r=await fetch(restBase+'/api/v1/tasks?limit=200');
        if(!r.ok)throw new Error();
        const d=await r.json();
        tasks=d.tasks||d||[];
        _selectedRunIdx=-1;  // always jump to most recent run on refresh
        renderTasks();updateMetrics();
        if(activeTab==='graph')drawGraph();
        if(activeTab==='workflows')loadWf();
      }catch(e){loadDemo();}
    }
    function dur(t){if(!t.ended_at||!t.started_at)return null;return(t.ended_at-t.started_at)*1000;}
    function fmtD(ms){if(ms===null||ms===undefined)return'—';if(ms<1000)return Math.round(ms)+'ms';return(ms/1000).toFixed(2)+'s';}
    function maxDur(){return Math.max(...tasks.map(t=>dur(t)||0),1);}
    function updateMetrics(){
      const tot=tasks.length,errs=tasks.filter(t=>t.status==='error'||t.exception).length;
      const ok=tasks.filter(t=>(t.status||'').toUpperCase()==='FINISHED'||(t.status||'').toUpperCase()==='COMPLETED'||(t.status||'').toUpperCase()==='SUCCESS').length;
      const ds=tasks.map(t=>dur(t)).filter(d=>d!==null);
      const avg=ds.length?ds.reduce((a,b)=>a+b,0)/ds.length:null;
      document.getElementById('m-total').textContent=tot;
      document.getElementById('m-ok').textContent=ok;
      document.getElementById('m-err').textContent=errs;
      document.getElementById('m-avg').textContent=fmtD(avg);
    }
    function renderTasks(){
      const el=document.getElementById('task-list');
      if(!tasks.length){el.innerHTML='<div class="empty"><i class="ti ti-database-off"></i>No tasks found</div>';return;}
      const mx=maxDur();
      el.innerHTML=tasks.slice(0,40).map(t=>{
        const d=dur(t);const isErr=t.status==='error'||t.exception;const isRun=t.status==='running';
        const dc=isErr?'dot-err':isRun?'dot-run':'dot-ok';const bc=isErr?'bar-err':isRun?'bar-run':'bar-ok';
        const pct=d?Math.max(3,(d/mx)*100):3;
        const sub=t.agent||t.workflow_name||'';
        return`<div class="task-row${selId===t.task_id?' sel':''}" onclick="selTask('${t.task_id}')">
          <div class="dot ${dc}"></div>
          <div class="task-info"><div class="task-name">${t.activity_name||t.task_id}</div><div class="task-sub">${sub}</div></div>
          <div class="dur">${fmtD(d)}</div>
          <div><div class="bar-bg"><div class="bar-fill ${bc}" style="width:${pct.toFixed(1)}%"></div></div></div>
        </div>`;
      }).join('');
    }
    function selTask(id){
      selId=id;renderTasks();
      const t=tasks.find(x=>x.task_id===id);if(!t)return;
      const el=document.getElementById('detail-body');
      const d=dur(t);
      const rows=[['ID',t.task_id],['Function',t.activity_name||'—'],['Agent',t.agent||'—'],
        ['Status',t.status||(t.exception?'error':'finished')],['Duration',fmtD(d)],
        ['Workflow',t.workflow_name||'—'],
        ['Input',t.used?JSON.stringify(t.used).slice(0,80):'—'],
        ['Output',t.generated?JSON.stringify(t.generated).slice(0,80):(t.exception?'⚠ '+String(t.exception).slice(0,70):'—')]
      ];
      el.innerHTML='<div class="kv-grid">'+rows.map(([k,v])=>`<div class="kv-k">${k}</div><div class="kv-v" title="${String(v).replace(/"/g,'')}">${v}</div>`).join('')+'</div>';
    }
    // Add a run selector UI above the graph
    function buildRunSelector(runs, selectedIdx, onSelect){
      const existing=document.getElementById('run-selector');
      if(existing)existing.remove();
      if(runs.length<1)return;
      const div=document.createElement('div');
      div.id='run-selector';
      div.style='display:flex;align-items:center;gap:6px;margin-bottom:10px;flex-wrap:wrap;';
      div.innerHTML='<span style="font-size:11px;color:var(--text2);white-space:nowrap">Run:</span>';
      // Show last 5 runs only (most recent first)
      const displayRuns=runs.slice(-5).reverse();
      const offset=Math.max(0, runs.length-5);
      displayRuns.forEach((r,di)=>{
        const i=runs.length-1-(di);  // real index in runs array
        const btn=document.createElement('button');
        btn.className='btn'+(i===selectedIdx?' btn-primary':'');
        btn.style='font-size:10px;padding:2px 8px;';
        const t=r[0];
        const ts=t.started_at?new Date(t.started_at*1000).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'}):'run '+(i+1);
        btn.textContent=ts;
        btn.onclick=()=>onSelect(i);
        div.appendChild(btn);
      });
      const provArea=document.querySelector('#panel-graph .prov-area');
      provArea.parentNode.insertBefore(div,provArea);
    }

    let _graphRuns=[], _selectedRunIdx=0;    

    function drawGraph(){
      const svg=document.getElementById('prov-svg');
      if(!tasks.length)return;

      // ── Config ────────────────────────────────────────────────────
      const COLS={'agent-a':'#378ADD','agent-b':'#1D9E75','agent-c':'#BA7517'};
      const DEFAULT_COL='#7C6AF7';
      const NODE_W=160, NODE_H=44, NODE_GAP=18;
      const COL_W=180, COL_PAD=16, HEADER_H=44, TOP_PAD=16;
      const CROSS_ARROW_COL='#E24B4A';

      // No client-side dedup needed: server returns only completed records,
      // one per task instance, already merged and sorted.
      const deduped=[...tasks];

      // ── Group into workflow runs ───────────────────────────────────
      const sorted=[...deduped].sort((a,b)=>(a.started_at||0)-(b.started_at||0));
      let runs=[];

      // Strategy 1: group ONLY tasks with a real workflow_id.
      const withId=sorted.filter(t=>t.bundle_exec_id||t.workflow_id);
      const withoutId=sorted.filter(t=>!t.bundle_exec_id&&!t.workflow_id);
      if(withId.length){
        const map={};
        withId.forEach(t=>{
          const key=t.bundle_exec_id||t.workflow_id;
          if(!map[key])map[key]=[];
          map[key].push(t);
        });
        runs=[...Object.values(map)];
      }
      if(withoutId.length){
        // Strategy 2: fixed-size batches for tasks without workflow_id
        const KNOWN_RUN_SIZE=4;
        for(let i=0;i<withoutId.length;i+=KNOWN_RUN_SIZE)
          runs.push(withoutId.slice(i,i+KNOWN_RUN_SIZE));
      }
      runs.sort((a,b)=>(a[0].started_at||0)-(b[0].started_at||0));

      _graphRuns=runs;
      // Default to most recent run
      if(_selectedRunIdx>=runs.length||_selectedRunIdx<0)_selectedRunIdx=runs.length-1;
      buildRunSelector(runs, _selectedRunIdx, (idx)=>{ _selectedRunIdx=idx; drawGraph(); });

      const latestRun=runs[_selectedRunIdx]||[];

      // ── Layout ────────────────────────────────────────────────────
      const agents=[...new Set(latestRun.map(t=>t.agent||'unknown'))];
      // Ensure consistent column order
      const agentOrder=['agent-a','agent-b','agent-c'];
      const orderedAgents=[...agentOrder.filter(a=>agents.includes(a)),...agents.filter(a=>!agentOrder.includes(a))];

      const agentTasks={};
      orderedAgents.forEach(a=>{agentTasks[a]=latestRun.filter(t=>(t.agent||'unknown')===a).sort((x,y)=>(x.started_at||0)-(y.started_at||0));});

      const maxRows=Math.max(...orderedAgents.map(a=>agentTasks[a].length),1);
      const W=Math.max(600, orderedAgents.length*COL_W+COL_PAD*2);
      const H=HEADER_H+TOP_PAD+maxRows*(NODE_H+NODE_GAP)+NODE_GAP+40;

      svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
      svg.setAttribute('height',H);

      const pos={};
      let s=`<defs>
        <marker id="arr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M1 1L11 6L1 11" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </marker>
        <marker id="arr-cross" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M1 1L11 6L1 11" fill="none" stroke="${CROSS_ARROW_COL}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </marker>
        <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
          <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.12"/>
        </filter>
      </defs>`;

      // ── Draw column backgrounds + headers ─────────────────────────
      orderedAgents.forEach((ag,ai)=>{
        const c=COLS[ag]||DEFAULT_COL;
        const cx=COL_PAD+ai*COL_W+COL_W/2;
        const colX=COL_PAD+ai*COL_W;
        s+=`<rect x="${colX+4}" y="4" width="${COL_W-8}" height="${H-8}" rx="12"
               fill="${c}0D" stroke="${c}40" stroke-width="1.5"/>`;
        // Header badge
        s+=`<rect x="${cx-52}" y="${TOP_PAD}" width="104" height="28" rx="14"
               fill="${c}" filter="url(#shadow)"/>`;
        s+=`<text x="${cx}" y="${TOP_PAD+18}" text-anchor="middle" font-size="12"
               font-weight="700" fill="#ffffff" letter-spacing="0.3">${ag}</text>`;
      });

      // ── Draw nodes ─────────────────────────────────────────────────
      orderedAgents.forEach((ag,ai)=>{
        const c=COLS[ag]||DEFAULT_COL;
        const cx=COL_PAD+ai*COL_W+COL_W/2;
        agentTasks[ag].forEach((t,ti)=>{
          const ty=HEADER_H+TOP_PAD+ti*(NODE_H+NODE_GAP)+NODE_H/2;
          const nx=cx-NODE_W/2, ny=ty-NODE_H/2;
          const isErr=t.status==='error'||!!t.exception;
          const fc=isErr?'#FEE2E2':'#ffffff';
          const sc=isErr?'#E24B4A':c;
          const tc=isErr?'#991B1B':c;
          pos[t.task_id]={x:cx,y:ty,left:nx,right:nx+NODE_W,agent:ag};

          // Card
          s+=`<rect x="${nx}" y="${ny}" width="${NODE_W}" height="${NODE_H}" rx="8"
                 fill="${fc}" stroke="${sc}" stroke-width="1.5" filter="url(#shadow)"/>`;
          // Left accent bar
          s+=`<rect x="${nx}" y="${ny}" width="4" height="${NODE_H}" rx="8" fill="${sc}"/>`;
          s+=`<rect x="${nx}" y="${ny+NODE_H/2}" width="4" height="${NODE_H/2}" rx="0" fill="${sc}"/>`;

          // Activity name — main label
          const label=(t.activity_name||t.task_id||'task');
          const shortLabel=label.length>22?label.slice(0,21)+'…':label;
          s+=`<text x="${nx+12}" y="${ny+17}" font-size="11" font-weight="600"
                 fill="${tc}" dominant-baseline="middle">${shortLabel}</text>`;

          // Sub-label: duration + status
          const d=dur(t);
          const statusMark=isErr?'✕ error':'✓';
          const subText=`${statusMark}${d!==null?' · '+fmtD(d):''}`;
          s+=`<text x="${nx+12}" y="${ny+31}" font-size="9.5" fill="${isErr?'#E24B4A':'#6B7280'}">${subText}</text>`;

          // Task id (tiny, right-aligned) — only show if we have a real id
          const rawId=t.task_id||t.activity_id||'';
          const shortId=rawId.length>6?rawId.slice(-6):rawId;
          if(shortId)s+=`<text x="${nx+NODE_W-8}" y="${ny+NODE_H-8}" font-size="8" fill="#9CA3AF"
                 text-anchor="end">#${shortId}</text>`;
        });
      });

      // ── Draw arrows ────────────────────────────────────────────────
      // Same-agent sequential arrows (vertical, inside column)
      orderedAgents.forEach(ag=>{
        const ts=agentTasks[ag];
        for(let i=0;i<ts.length-1;i++){
          const a=pos[ts[i].task_id], b=pos[ts[i+1].task_id];
          if(!a||!b)continue;
          const x=a.x, y1=a.y+NODE_H/2+1, y2=b.y-NODE_H/2-1;
          s+=`<line x1="${x}" y1="${y1}" x2="${x}" y2="${y2}"
                stroke="${COLS[ag]||DEFAULT_COL}80" stroke-width="1.5"
                stroke-dasharray="3 3" marker-end="url(#arr)"/>`;
        }
      });

      // Cross-agent arrows: connect last task of each agent to first task of next agent
      // Order agents by the earliest task start time in this run
      const agentFirstStart={};
      orderedAgents.forEach(ag=>{
        const ts=agentTasks[ag];
        agentFirstStart[ag]=ts.length?Math.min(...ts.map(t=>t.started_at||0)):Infinity;
      });
      const timeOrderedAgents=[...orderedAgents].sort((a,b)=>agentFirstStart[a]-agentFirstStart[b]);

      for(let i=0;i<timeOrderedAgents.length-1;i++){
        const srcAg=timeOrderedAgents[i], dstAg=timeOrderedAgents[i+1];
        const srcTasks=agentTasks[srcAg], dstTasks=agentTasks[dstAg];
        if(!srcTasks.length||!dstTasks.length)continue;
        // Connect last task of source to first task of destination
        const srcT=srcTasks[srcTasks.length-1], dstT=dstTasks[0];
        const a=pos[srcT.task_id], b=pos[dstT.task_id];
        if(!a||!b)continue;
        const fromRight=a.x<b.x;
        const x1=fromRight?a.right+2:a.left-2;
        const x2=fromRight?b.left-2:b.right+2;
        const y1=a.y, y2=b.y;
        const mx=(x1+x2)/2;
        s+=`<path d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}"
              fill="none" stroke="${CROSS_ARROW_COL}" stroke-width="2.5"
              marker-end="url(#arr-cross)"/>`;
      }

      // ── Legend ────────────────────────────────────────────────────
      const legendY=H-26;
      s+=`<circle cx="${COL_PAD+8}" cy="${legendY}" r="5" fill="#6B728050"/>`;
      s+=`<line x1="${COL_PAD+3}" y1="${legendY}" x2="${COL_PAD+22}" y2="${legendY}" stroke="#6B728080" stroke-width="1.5" stroke-dasharray="3 3"/>`;
      s+=`<text x="${COL_PAD+26}" y="${legendY+4}" font-size="9" fill="#9CA3AF">sequential</text>`;
      s+=`<line x1="${COL_PAD+100}" y1="${legendY}" x2="${COL_PAD+119}" y2="${legendY}" stroke="${CROSS_ARROW_COL}" stroke-width="2"/>`;
      s+=`<text x="${COL_PAD+123}" y="${legendY+4}" font-size="9" fill="#9CA3AF">cross-agent handoff</text>`;
      s+=`<text x="${W-COL_PAD}" y="${legendY+4}" font-size="9" fill="#9CA3AF" text-anchor="end">run ${_selectedRunIdx+1} of ${runs.length}</text>`;

      svg.innerHTML=s;
    }
    async function loadWf(){
      try{
        const r=await fetch(restBase+'/api/v1/workflows');const d=await r.json();
        const wfs=d.workflows||d||[];const el=document.getElementById('wf-list');
        if(!wfs.length){el.innerHTML='<div class="empty"><i class="ti ti-sitemap"></i>No workflows found</div>';return;}
        el.innerHTML=wfs.slice(0,15).map(w=>`<div class="wf-row">
          <div style="font-weight:500">${w.workflow_id||w.name||'—'}</div>
          <div style="color:var(--text2);font-size:11px">${w.task_count||'?'} tasks</div>
          <div style="color:var(--text2);font-size:11px">${w.started_at?new Date(w.started_at*1000).toLocaleTimeString():'—'}</div>
        </div>`).join('');
      }catch(e){document.getElementById('wf-list').innerHTML='<div class="empty"><i class="ti ti-sitemap"></i>Could not load workflows</div>';}
    }
    function q(txt){document.getElementById('qin').value=txt;sendQ();}
    async function sendQ(){
      const inp=document.getElementById('qin');const qt=inp.value.trim();if(!qt)return;
      inp.value='';const msgs=document.getElementById('msgs');
      msgs.innerHTML+=`<div class="msg msg-user">${qt}</div>`;
      msgs.innerHTML+=`<div class="msg msg-agent msg-loading" id="lmsg">Querying PROV-AGENT…</div>`;
      msgs.scrollTop=msgs.scrollHeight;
      try{
        const r=await fetch(agentBase+'/query',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:qt})});
        const data=await r.json();
        let ans='';
        if(typeof data==='string')ans=data;
        else if(data.answer)ans=data.answer;
        else if(data.result)ans=typeof data.result==='object'?JSON.stringify(data.result,null,2):data.result;
        else if(data.error)ans='⚠ '+data.error;
        else ans=JSON.stringify(data,null,2);
        const lm=document.getElementById('lmsg');
        const isMono=ans.startsWith('{')||ans.startsWith('[');
        if(lm)lm.outerHTML=`<div class="msg msg-agent"><${isMono?'pre':'span'}>${ans.slice(0,1000)}</${isMono?'pre':'span'}></div>`;
      }catch(e){
        const lm=document.getElementById('lmsg');
        if(lm)lm.outerHTML=`<div class="msg msg-agent">⚠ Cannot reach PROV-AGENT at ${agentBase}.<br>Run: <code>kubectl port-forward svc/flowcept-agent -n openlit-demo 8010:8000</code></div>`;
      }
      msgs.scrollTop=msgs.scrollHeight;
    }
    connect();
    // Auto-refresh tasks every 10 seconds
    setInterval(()=>{ if(document.getElementById('badge').className.includes('live')) refresh(); }, 10000);
    </script>
    </body>
    </html>
    
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: flowcept-ui
  namespace: openlit-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flowcept-ui
  template:
    metadata:
      labels:
        app: flowcept-ui
    spec:
      containers:
        - name: flowcept-ui
          image: python:3.11-slim
          command: ["/bin/sh", "-c"]
          args:
            - |
              mkdir -p /app &&
              cp /html/index.html /app/index.html &&
              cd /app &&
              python3 -m http.server 8020
          ports:
            - name: ui
              containerPort: 8020
          volumeMounts:
            - name: html
              mountPath: /html
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
      volumes:
        - name: html
          configMap:
            name: flowcept-ui-html

---
apiVersion: v1
kind: Service
metadata:
  name: flowcept-ui
  namespace: openlit-demo
spec:
  selector:
    app: flowcept-ui
  ports:
    - name: ui
      port: 8020
      targetPort: 8020
      
      
      
---
# =============================================================================
# Ollama — local LLM inference server, pre-pulls tinyllama on startup
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: openlit-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
      - name: ollama
        image: ollama/ollama:latest
        ports:
        - name: http
          containerPort: 11434
        # postStart pulls tinyllama immediately; mistral is pulled on demand
        # Models persist in the ollama-models PVC — survive pod restarts
        lifecycle:
          postStart:
            exec:
              command: ["/bin/sh", "-c", "sleep 5 && ollama pull tinyllama"]
        resources:
          requests:
            memory: "1Gi"
            cpu: "1000m"
          limits:
            memory: "6Gi"
            cpu: "2000m"
        volumeMounts:
          - name: ollama-models
            mountPath: /root/.ollama
      volumes:
        - name: ollama-models
          persistentVolumeClaim:
            claimName: ollama-models
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models
  namespace: openlit-demo
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: openlit-demo
spec:
  selector:
    app: ollama
  ports:
    - name: http
      port: 11434
      targetPort: 11434

# =============================================================================
# SETUP GUIDE
# =============================================================================
#
# ── LANGFUSE (deploy separately via Helm) ────────────────────────────────────
# 1. Add Helm repo:
#    helm repo add langfuse https://langfuse.github.io/langfuse-k8s
#    helm repo update
#
# 2. Deploy using the provided values file:
#    helm install langfuse langfuse/langfuse -n langfuse --create-namespace \
#      -f langfuse-storage-values.yaml
#
# 3. Generate Langfuse API keys:
#    - Port-forward:  kubectl port-forward svc/langfuse-web -n langfuse 3002:3000
#    - Open:          http://localhost:3002
#    - Settings → API Keys → Create new key pair (pk-lf-... / sk-lf-...)
#    - Encode:        echo -n "pk-lf-XXX:sk-lf-YYY" | base64
#    - Paste the result into the Authorization header of otlphttp/langfuse
#      in the otel-collector-config ConfigMap above, then redeploy.
#
# ── OPENLIT (deploy separately via Helm) ─────────────────────────────────────
# 1. helm repo add openlit https://helm.openlit.ai && helm repo update
# 2. helm install openlit openlit/openlit -n openlit --create-namespace
#
# ── FLOWCEPT PROVENANCE DASHBOARD ────────────────────────────────────────────
# The Flowcept UI at http://localhost:8020 connects to the REST API at
# http://localhost:5000/api/v1 (flowcept-rest) and the PROV-AGENT query
# endpoint at http://localhost:5000 (flowcept-agent).
#
# Both are already wired in the UI defaults — just click Connect.
#
# Run selector: each curl http://localhost:8080/run generates a unique
# run_id (uuid) that is stamped as workflow_id on all 4 task records.
# The Prov graph groups records by workflow_id so each run is selectable
# independently. Up to 5 recent runs are shown in the selector.
#
# Clear provenance data:
#   kubectl exec -n openlit-demo deployment/flowcept-mongodb -- \
#     mongosh flowcept --eval "db.tasks.drop()"
#   Or use the trash icon in the Flowcept UI header.
# =============================================================================
