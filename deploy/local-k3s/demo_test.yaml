# =============================================================================
# MULTI-AGENT OBSERVABILITY DEMO — base stack, LOCAL k3s  (namespace: openlit-demo)
# Stack: OpenLIT · Jaeger · Prometheus · Grafana · Langfuse · Phoenix · Flowcept
# Repo path: deploy/local-k3s/demo_test.yaml
#
# COMPONENTS DEPLOYED BY THIS FILE
#   otel-collector     — OTLP receiver, fans out traces/metrics to all backends
#   jaeger             — distributed trace waterfall UI
#   prometheus         — metrics store
#   grafana            — unified dashboard (Prometheus + Jaeger datasources)
#   minio              — S3-compatible storage for Langfuse event uploads
#   phoenix            — Arize Phoenix LLM observability UI
#   ollama             — local LLM inference server (tinyllama)
#   flowcept-redis     — message broker for the Flowcept provenance stream
#   flowcept-mongodb   — W3C PROV-compliant provenance store
#   flowcept-consumer  — Redis → MongoDB pipeline worker
#   flowcept-agent     — unified REST API + natural-language provenance query server
#   flowcept-rest      — read-only structured REST query API (Swagger at /docs)
#   flowcept-ui        — Provenance Dashboard web UI
#   agent-a/b/c        — demo multi-agent application (OTel + Flowcept instrumented)
#
# DEPLOYED SEPARATELY
#   OpenLIT    — Helm into namespace "openlit"
#   Langfuse   — Helm into namespace "langfuse" (see langfuse-storage-values.yaml)
#
# RELATED FILES (repo reorganised into deploy/{common,local-k3s,robopaas}/)
#   This file is the BASE stack for local k3s. The demos below are separate and
#   applied on top of it (the same demo files work on either cluster):
#     deploy/common/demo_spectra.yaml     — SPECTRA dual-layer pipeline + GUI
#         Different service/trigger from agent-a below: port-forward
#         svc/spectra-pipeline 8502:8000, then
#         curl 'http://localhost:8502/run?document=hello'  (writes the causal DAG)
#     deploy/common/demo_langgraph.yaml   — LangGraph 5-agent demo
#   GPU / institute-cluster base stack:
#     deploy/robopaas/demo_test_robopaas.yaml
#
# PORT-FORWARD CHEATSHEET (run each in its own terminal)
#   kubectl port-forward svc/agent-a        -n openlit-demo 8080:8000
#   kubectl port-forward svc/jaeger         -n openlit-demo 16686:16686
#   kubectl port-forward svc/prometheus     -n openlit-demo 9090:9090
#   kubectl port-forward svc/grafana        -n openlit-demo 3001:3000
#   kubectl port-forward svc/openlit        -n openlit      3000:3000
#   kubectl port-forward svc/langfuse-web   -n langfuse     3002:3000
#   kubectl port-forward svc/minio          -n openlit-demo 9001:9001
#   kubectl port-forward svc/phoenix        -n openlit-demo 6006:6006
#   kubectl port-forward svc/flowcept-ui    -n openlit-demo 8020:8020
#   kubectl port-forward svc/flowcept-rest  -n openlit-demo 5000:5000
#
# QUICK START
#   1. Deploy:      kubectl apply -f deploy/local-k3s/demo_test.yaml
#   2. Wait ~3min for pip installs and ollama pull to complete
#   3. Port-forward the services you need (see above)
#   4. Trigger a run:  curl http://localhost:8080/run
#   5. Open UI:     http://localhost:8020
#   6. Open docs:   http://localhost:5000/docs
#   7. Query PROV:  curl -s -X POST http://localhost:5000/api/v1/query \
#                        -H "Content-Type: application/json" \
#                        -d '{"question": "which agent took longest on average?"}'
#
# AFTER DEPLOYMENT — redeployment workflow
#   kubectl apply -f deploy/local-k3s/demo_test.yaml
#   kubectl rollout restart deployment/agent-a deployment/agent-b deployment/agent-c \
#     deployment/flowcept-rest deployment/flowcept-agent deployment/flowcept-consumer \
#     deployment/flowcept-ui -n openlit-demo
#   # Clear old provenance data (optional):
#   kubectl exec -n openlit-demo deployment/flowcept-mongodb -- \
#     mongosh flowcept --eval "db.tasks.drop()"
# =============================================================================



apiVersion: v1
kind: Namespace
metadata:
  name: openlit-demo

---
# =============================================================================
# Flowcept settings.yaml — configures Redis + MongoDB for all pods
# Mounted at /root/.flowcept/settings.yaml in every agent and flowcept pod.
# Flowcept reads this file at startup; env vars alone are not sufficient.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: flowcept-settings
  namespace: openlit-demo
data:
  settings.yaml: |
    project: 
      debug: false
      db_flush_mode: online
      enrich_messages: false
    mq:
      enabled: true
      type: redis
      host: flowcept-redis
      port: 6379
      channel: interception
      buffer_size: 1
      insertion_buffer_time_secs: 1
      same_as_kvdb: false
    kv_db:
      enabled: true
      host: flowcept-redis
      port: 6379
    databases:
      mongodb:
        enabled: true
        host: flowcept-mongodb
        port: 27017
        db: flowcept
        create_collection_index: true
    agent:
      enabled: true
      mcp_host: 0.0.0.0
      mcp_port: 8096
      start_persistence_daemon: true

---
# =============================================================================
# OTel Collector — ConfigMap
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: openlit-demo
data:
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch:
        timeout: 1s
        send_batch_size: 512

      # 1. ADDED: Transform processor to inject missing LLM metadata
      transform:
        error_mode: ignore
        trace_statements:
          - context: span
            statements:
              # Only inject Langfuse metadata if the span is an actual LLM/GenAI call
              - set(attributes["langfuse.observation.type"], "generation") where attributes["gen_ai.system"] != nil
              
              # Safely handle model attributes
              - set(attributes["llm.model"], attributes["gen_ai.request.model"]) where attributes["gen_ai.request.model"] != nil
              
              # Standardize provider taxonomy cleanly without blind overwrites
              - set(attributes["llm.provider"], attributes["gen_ai.system"]) where attributes["gen_ai.system"] != nil
              - set(attributes["llm.provider"], "ollama") where attributes["llm.provider"] == nil
              - set(attributes["gen_ai.system"], "ollama") where attributes["gen_ai.system"] == nil
              
    exporters:
      debug:
        verbosity: basic

      # ── OpenLIT ──────────────────────────────────────────────────────
      otlphttp/openlit:
        endpoint: "http://openlit.openlit.svc.cluster.local:4318"
        tls:
          insecure: true

      # ── Jaeger ───────────────────────────────────────────────────────
      otlp/jaeger:
        endpoint: "jaeger:14317"
        tls:
          insecure: true

      # ── Prometheus ───────────────────────────────────────────────────
      prometheus:
        endpoint: "0.0.0.0:8889"

      # ── Langfuse ─────────────────────────────────────────────────────
      # Update Authorization with your base64(pk-lf-...:sk-lf-...) key
      # See setup guide at the bottom of this file.
      otlphttp/langfuse:
        endpoint: "http://langfuse-web.langfuse.svc.cluster.local:3000/api/public/otel"
        headers:
          Authorization: "Basic ${LANGFUSE_AUTH_B64}"
        tls:
          insecure: true

      # ── Arize Phoenix ────────────────────────────────────────────────
      otlp/phoenix:
        endpoint: "http://phoenix:4317"
        tls:
          insecure: true

    service:
      telemetry:
        metrics:
          address: 0.0.0.0:8888   # collector's own internal metrics for Prometheus

      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch, transform]
          # ╔══════════════════════════════════════════════════════════════╗
          # ║  LANGFUSE IS DISABLED BY DEFAULT                            ║
          # ║  otlphttp/langfuse is intentionally absent from this list.  ║
          # ║  To enable: complete Step 6 of the setup guide (generate    ║
          # ║  API keys, update the Authorization header above, then      ║
          # ║  add otlphttp/langfuse to the exporters list below).        ║
          # ╚══════════════════════════════════════════════════════════════╝
          exporters: [debug, otlphttp/openlit, otlp/jaeger, otlp/phoenix, otlphttp/langfuse]

        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug, otlphttp/openlit, prometheus]
          
        logs:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug, otlphttp/openlit]


---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: openlit-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8888"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.104.0
          args: ["--config=/etc/otel.yaml"]
          volumeMounts:
            - name: config
              mountPath: /etc/otel.yaml
              subPath: otel-collector-config.yaml
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: prom-agents
              containerPort: 8889
            - name: prom-self
              containerPort: 8888
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
      volumes:
        - name: config
          configMap:
            name: otel-collector-config

---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: openlit-demo
spec:
  selector:
    app: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
    - name: prom-agents
      port: 8889
      targetPort: 8889
    - name: prom-self
      port: 8888
      targetPort: 8888


---
# =============================================================================
# MinIO — S3-compatible storage for Langfuse event uploads
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: openlit-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
      - name: minio
        image: quay.io/minio/minio:latest
        args: ["server", "/data", "--console-address", ":9001"]
        env:
        - name: MINIO_ROOT_USER
          value: "langfuse"
        - name: MINIO_ROOT_PASSWORD
          value: "${MINIO_SECRET_KEY}"
        lifecycle:
          postStart:
            exec:
              command: ["/bin/sh", "-c", "sleep 5 && mkdir  -p /data/langfuse-otel && echo 'bucket ready'"]
        ports:
        - containerPort: 9000
        - containerPort: 9001
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: openlit-demo
spec:
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
      
---
# =============================================================================
# Jaeger — all-in-one (in-memory storage, suitable for demo)
# UI at http://localhost:16686 (after port-forward)
#
# so there is no port collision with the OTel Collector Service.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: openlit-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.57
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
          ports:
            - name: ui
              containerPort: 16686
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "300m"

---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: openlit-demo
spec:
  selector:
    app: jaeger
  ports:
    - name: ui
      port: 16686
      targetPort: 16686
    - name: otlp-grpc
      port: 14317          # external 14317 → Jaeger internal 4317
      targetPort: 4317
    - name: otlp-http
      port: 14318          # external 14318 → Jaeger internal 4318
      targetPort: 4318

---
# =============================================================================
# Prometheus — scrapes collector metrics
# UI at http://localhost:9090 (after port-forward)
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: openlit-demo
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      # Collector internal pipeline metrics (otelcol_exporter_sent_spans etc.)
      - job_name: "otel-collector-internal"
        static_configs:
          - targets: ["otel-collector:8888"]

      # Agent/AI metrics forwarded through the prometheus exporter
      - job_name: "otel-collector-agents"
        static_configs:
          - targets: ["otel-collector:8889"]

      # Jaeger internal metrics
      - job_name: "jaeger"
        static_configs:
          - targets: ["jaeger:16686"]

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: openlit-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: openlit-demo-prometheus
rules:
  - apiGroups: [""]
    resources: [pods, services, endpoints]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openlit-demo-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: openlit-demo-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: openlit-demo

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: openlit-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.52.0
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.retention.time=3d"
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
          ports:
            - containerPort: 9090
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "200m"
      volumes:
        - name: config
          configMap:
            name: prometheus-config

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: openlit-demo
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090

---
# =============================================================================
# Grafana — datasources (auto-provisioned on startup, no manual UI setup)
# UI at http://localhost:3001 — login: admin / admin
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: openlit-demo
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: true

      - name: Jaeger
        type: jaeger
        access: proxy
        url: http://jaeger:16686
        editable: true

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-config
  namespace: openlit-demo
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: multi-agent-demo
        folder: Multi-Agent Demo
        type: file
        options:
          path: /var/lib/grafana/dashboards

---
# =============================================================================
# Grafana — Multi-Agent Overview Dashboard
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-multiagent
  namespace: openlit-demo
data:
  multi-agent-overview.json: |
    {
      "title": "Multi-Agent Demo Overview",
      "uid": "multiagent-overview",
      "schemaVersion": 38,
      "time": { "from": "now-30m", "to": "now" },
      "refresh": "10s",
      "panels": [
        {
          "id": 1, "type": "stat",
          "title": "Spans → OpenLIT (last 5m)",
          "gridPos": { "x": 0, "y": 0, "w": 6, "h": 4 },
          "targets": [{ "datasource": "Prometheus",
            "expr": "increase(otelcol_exporter_sent_spans{exporter=\"otlphttp/openlit\"}[5m])" }],
          "options": { "colorMode": "background", "graphMode": "area" }
        },
        {
          "id": 2, "type": "stat",
          "title": "Spans → Jaeger (last 5m)",
          "gridPos": { "x": 6, "y": 0, "w": 6, "h": 4 },
          "targets": [{ "datasource": "Prometheus",
            "expr": "increase(otelcol_exporter_sent_spans{exporter=\"otlp/jaeger\"}[5m])" }],
          "options": { "colorMode": "background", "graphMode": "area" }
        },
        {
          "id": 3, "type": "stat",
          "title": "Spans → Langfuse (last 5m)",
          "gridPos": { "x": 12, "y": 0, "w": 6, "h": 4 },
          "targets": [{ "datasource": "Prometheus",
            "expr": "increase(otelcol_exporter_sent_spans{exporter=\"otlphttp/langfuse\"}[5m])" }],
          "options": { "colorMode": "background" }
        },
        {
          "id": 4, "type": "stat",
          "title": "Export Failures (last 5m)",
          "gridPos": { "x": 18, "y": 0, "w": 6, "h": 4 },
          "targets": [{ "datasource": "Prometheus",
            "expr": "sum(otelcol_exporter_send_failed_spans)" }],
          "options": { "colorMode": "background",
            "thresholds": { "steps": [{"color":"green","value":0},{"color":"red","value":1}] } }
        },
        {
          "id": 5, "type": "timeseries",
          "title": "Span export rate per backend (spans/s)",
          "gridPos": { "x": 0, "y": 4, "w": 24, "h": 8 },
          "targets": [{ "datasource": "Prometheus",
            "expr": "otelcol_exporter_sent_spans",
            "legendFormat": "{{ exporter }}" }]
        },
        {
          "id": 6, "type": "timeseries",
          "title": "Spans received by collector (spans/s)",
          "gridPos": { "x": 0, "y": 12, "w": 12, "h": 8 },
          "targets": [{ "datasource": "Prometheus",
            "expr": "otelcol_receiver_accepted_spans",
            "legendFormat": "{{ receiver }}" }]
        },
        {
          "id": 7, "type": "timeseries",
          "title": "Collector memory (MB)",
          "gridPos": { "x": 12, "y": 12, "w": 12, "h": 8 },
          "targets": [{ "datasource": "Prometheus",
            "expr": "otelcol_process_memory_rss / 1024 / 1024",
            "legendFormat": "RSS MB" }]
        }
      ]
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: openlit-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:10.4.3
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "admin"
            - name: GF_FEATURE_TOGGLES_ENABLE
              value: "traceqlEditor"
          ports:
            - containerPort: 3000
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboards-config
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboards-config
          configMap:
            name: grafana-dashboards-config
        - name: dashboards
          configMap:
            name: grafana-dashboard-multiagent

---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: openlit-demo
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000

---
# =============================================================================
# Agent A — entry point, calls Agent B with W3C traceparent propagation
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-a
  namespace: openlit-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-a
  template:
    metadata:
      labels:
        app: agent-a
    spec:
      containers:
        - name: agent-a
          image: python:3.10-slim
          command: ["/bin/sh", "-c"]
          args:
            - |
              pip install --no-cache-dir fastapi uvicorn requests openlit opentelemetry-sdk opentelemetry-exporter-otlp pytz pandas numpy lmdb psutil py-cpuinfo pymongo redis gitpython && pip install --no-cache-dir "flowcept[mongo]"
              
              cat <<'PY' > /app.py
              import os, json, sys, time, redis, requests
              os.environ["OTEL_SERVICE_NAME"] = "agent-a"
              os.environ["OPENLIT_APPLICATION_NAME"] = "multi-agent-demo"
              
              import openlit
              from fastapi import FastAPI, Request
              from opentelemetry import trace
              from opentelemetry.propagate import inject, extract
              
              openlit.init()
              app = FastAPI()
              tracer = trace.get_tracer("agent-a")
              r_client = redis.Redis(host="flowcept-redis", port=6379, decode_responses=True)
              
              @app.get("/run")
              def run(request: Request):
                  import uuid
                  print("LOG [Agent A]: /run endpoint triggered", flush=True)
                  ctx = extract(dict(request.headers))
                  with tracer.start_as_current_span("agent-a.run", context=ctx):
                      headers = {}
                      inject(headers)
                      
                      run_id = str(uuid.uuid4())[:8]
                      start_time = time.time()
                      
                      print("LOG [Agent A]: Directing payload request to agent-b with 60s timeout...", flush=True)
                      try:
                          resp = requests.post("http://agent-b:8000/plan",
                                             json={"task": "hello from agent-a", "run_id": run_id},
                                             headers=headers,
                                             timeout=60)
                          result = resp.json()
                      except Exception as req_err:
                          print(f"LOG ERROR [Agent A]: Outbound call failed or timed out: {req_err}", flush=True)
                          result = {"error": str(req_err)}
                      
                      task_record = {
                          "activity_id": "agent_a_run",
                          "workflow_id": run_id,
                          "custom_metadata": {"agent": "agent-a"},
                          "used": {"task": "hello from agent-a"},
                          "generated": result,
                          "started_at": start_time,
                          "ended_at": time.time(),
                          "status": "ERROR" if "error" in result else "FINISHED"
                      }
                      try:
                          r_client.rpush("interception", json.dumps(task_record))
                      except Exception: pass
                          
                      return result
              PY
              python3 -u -m uvicorn app:app --host 0.0.0.0 --port 8000
          ports:
            - containerPort: 8000
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: FLOWCEPT_SETTINGS_PATH
              value: "/root/.flowcept/settings.yaml"
            - name: OTEL_SERVICE_NAME
              value: "agent-a"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.openlit-demo.svc.cluster.local:4318"
