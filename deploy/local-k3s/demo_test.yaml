              pip install --no-cache-dir fastapi uvicorn gitpython openlit opentelemetry-sdk opentelemetry-exporter-otlp pytz pandas numpy lmdb psutil py-cpuinfo pymongo redis && pip install --no-cache-dir "flowcept[mongo]"
              
              cat <<'PY' > /app.py
              import os, json, sys, time, redis
              os.environ["OTEL_SERVICE_NAME"] = "agent-c"
              os.environ["OPENLIT_APPLICATION_NAME"] = "multi-agent-demo"
              
              import openlit
              from fastapi import FastAPI, Request
              from opentelemetry import trace
              from opentelemetry.propagate import extract
              
              openlit.init()
              app = FastAPI()
              tracer = trace.get_tracer("agent-c")
              r_client = redis.Redis(host="flowcept-redis", port=6379, decode_responses=True)
              
              @app.post("/execute")
              def execute(data: dict, request: Request):
                  print("LOG [Agent C]: /execute endpoint triggered", flush=True)
                  run_id = data.get("run_id", "unknown")
                  ctx = extract(dict(request.headers))
                  with tracer.start_as_current_span("agent-c.execute", context=ctx):
                      start_time = time.time()
                      
                      # Simulate execution output
                      output = {"result": "executed: " + data["plan"]}
                      
                      # Single push with both timestamps for clean provenance
                      task_record = {
                          "activity_id": "agent_c_run",
                          "workflow_id": run_id,
                          "custom_metadata": {"agent": "agent-c"},
                          "used": {"plan": data["plan"]},
                          "generated": output,
                          "started_at": start_time,
                          "ended_at": time.time(),
                          "status": "FINISHED"
                      }
                      try:
                          r_client.rpush("interception", json.dumps(task_record))
                          print("LOG [Agent C]: Redis push successful!", flush=True)
                      except Exception as e:
                          print(f"LOG ERROR [Agent C]: Redis push failed: {e}", flush=True)
                      
                      return output
              PY
              python3 -u -m uvicorn app:app --host 0.0.0.0 --port 8000
