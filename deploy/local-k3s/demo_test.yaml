# =============================================================================
# Agent B — planner, calls Ollama (tinyllama) then forwards to Agent C
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-b
  namespace: openlit-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-b
  template:
    metadata:
      labels:
        app: agent-b
    spec:
      containers:
        - name: agent-b
          image: python:3.10-slim
          command: ["/bin/sh", "-c"]
          args:
            - |
              pip install --no-cache-dir fastapi uvicorn requests openai openlit langfuse opentelemetry-sdk opentelemetry-exporter-otlp pytz pandas numpy lmdb psutil py-cpuinfo pymongo redis gitpython && pip install --no-cache-dir "flowcept[mongo]"
              
              cat <<'PY' > /app.py
              import os, json, sys, time, redis, requests, openai
              os.environ["OTEL_SERVICE_NAME"] = "agent-b"
              os.environ["OPENLIT_APPLICATION_NAME"] = "multi-agent-demo"
              
              import openlit
              # Import the Langfuse automatic wrapper
              from langfuse.openai import openai as langfuse_openai
              from fastapi import FastAPI, Request
              from opentelemetry import trace
              from opentelemetry.propagate import inject, extract
              
              openlit.init()
              app = FastAPI()
              tracer = trace.get_tracer("agent-b")
              r_client = redis.Redis(host="flowcept-redis", port=6379, decode_responses=True)
              
              @app.post("/plan")
              def plan(data: dict, request: Request):
                  print("LOG [Agent B]: /plan endpoint triggered", flush=True)
                  run_id = data.get("run_id", "unknown")
                  ctx = extract(dict(request.headers))
                  with tracer.start_as_current_span("agent-b.plan", context=ctx, attributes={"llm.provider": "ollama", "llm.model": "tinyllama"}):
                      
                      start_llm = time.time()
                      
                      client = langfuse_openai.OpenAI(
                          api_key="ollama", 
                          base_url="http://ollama:11434/v1"
                      )
                      
                      print("LOG [Agent B]: Calling Ollama inference backend stream...", flush=True)
                      response_stream = client.chat.completions.create(
                          model="tinyllama",
                          messages=[{"role": "user", "content": data["task"]}],
                          max_tokens=150,
                          stream=True,
                          stream_options={"include_usage": True},
                          # Tag the dashboard trace metadata dynamically
                          name="agent-b-planning-task",
                          metadata={"environment": "dev", "agent": "agent-b"}
                      )
                      
                      plan_text = ""
                      p_tokens = 0
                      c_tokens = 0
                      
                      for chunk in response_stream:
                          if chunk.choices and len(chunk.choices) > 0:
                              delta = chunk.choices[0].delta.content
                              if delta:
                                  plan_text += delta
                          
                          if hasattr(chunk, 'usage') and chunk.usage is not None:
                              p_tokens = chunk.usage.prompt_tokens
                              c_tokens = chunk.usage.completion_tokens
                              
                      end_llm = time.time()
                      
                      if p_tokens == 0 or c_tokens == 0:
                          p_tokens = max(1, len(data["task"]) // 4)
                          c_tokens = max(1, len(plan_text) // 4)
                          print(f"LOG [Agent B]: Applied fallback estimation (Prompt: {p_tokens}, Completion: {c_tokens})", flush=True)
                      else:
                          print(f"LOG [Agent B]: Tracked stream metadata metrics (Prompt: {p_tokens}, Completion: {c_tokens})", flush=True)
                      
                      primitive_task_llm = {
                          "activity_id": "call_llm",
                          "workflow_id": run_id,
                          "custom_metadata": {"agent": "agent-b"},
                          "used": {"task": data["task"]},
                          "generated": {"response": plan_text},
                          "started_at": start_llm,
                          "ended_at": end_llm,
                          "status": "SUBMITTED"
                      }
                      try:
                          r_client.rpush("interception", json.dumps(primitive_task_llm))
                      except Exception: pass

                      start_c = time.time()
                      headers = {}
                      inject(headers)
                      
                      print("LOG [Agent B]: Forwarding plan to Agent C with 60s timeout...", flush=True)
                      try:
                          res_c = requests.post("http://agent-c:8000/execute",
                                               json={"plan": plan_text, "run_id": run_id},
                                               headers=headers,
                                               timeout=60)
                          result = res_c.json()
                      except Exception as c_err:
                          print(f"LOG ERROR [Agent B]: Agent C call dropped: {c_err}", flush=True)
                          result = {"error": str(c_err)}
                          
                      primitive_task_c = {
                          "activity_id": "call_agent_c",
                          "workflow_id": run_id,
                          "custom_metadata": {"agent": "agent-b"},
                          "used": {"plan": plan_text},
                          "generated": result,
                          "started_at": start_c,
                          "ended_at": time.time(),
                          "status": "ERROR" if "error" in result else "FINISHED",
                          "exception": result.get("error")
                      }
                      try:
                          r_client.rpush("interception", json.dumps(primitive_task_c))
                      except Exception: pass
                      
                      return result
              PY
              python3 -u -m uvicorn app:app --host 0.0.0.0 --port 8000
          ports:
            - containerPort: 8000
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: FLOWCEPT_SETTINGS_PATH
              value: "/root/.flowcept/settings.yaml"
            - name: GIT_PYTHON_REFRESH
              value: "quiet"
            - name: OTEL_SERVICE_NAME
              value: agent-b
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.openlit-demo.svc.cluster.local:4318"
            - name: OPENLIT_APPLICATION_NAME
              value: multi-agent-demo
            - name: OPENLIT_ENVIRONMENT
              value: dev
            - name: OPENLIT_PRICING_JSON
              value: '{"tinyllama": {"prompt_token": 0.10, "completion_token": 0.10}}'
            - name: OPENAI_API_KEY
              value: "ollama"
            - name: OPENAI_BASE_URL
              value: "http://ollama:11434/v1"
            - name: OLLAMA_MODEL
              value: "tinyllama"
              
            # Langfuse receives traces via the OTel Collector (otel-collector-config ConfigMap).
            # The LANGFUSE_HOST env var is intentionally absent here — the Langfuse SDK
            # should NOT export directly from the agent. All telemetry goes through the
            # collector's otlphttp/langfuse exporter. Remove these keys if present.
          resources:
            requests:
              memory: "256Mi"
              cpu: "300m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          volumeMounts:
            - name: flowcept-cfg
              mountPath: /root/.flowcept
      volumes:
        - name: flowcept-cfg
          configMap:
            name: flowcept-settings
