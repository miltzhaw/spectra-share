kind: ConfigMap
metadata:
  name: spectra-flowcept-settings
  namespace: openlit-demo
data:
  settings.yaml: |
    project:
      debug: false
      db_flush_mode: online
      enrich_messages: false
    mq:
      enabled: true
      type: redis
      host: flowcept-redis
      port: 6379
      channel: interception
      buffer_size: 1
      insertion_buffer_time_secs: 1
      same_as_kvdb: false
    kv_db:
      enabled: true
      host: flowcept-redis
      port: 6379
    databases:
      mongodb:
        enabled: true
        host: flowcept-mongodb
        port: 27017
        db: flowcept
        create_collection_index: true
    agent:
      enabled: false

