---
# =============================================================================
# SPECTRA Pipeline — dual-layer LangGraph research analysis pipeline
#
# Exposes:
#   GET /run            — trigger a full pipeline run
#   GET /run/status     — last run summary
#   GET /health         — liveness check
#
# Each run produces:
#   /data/flowcept_buffer.jsonl     — raw Flowcept events (GUI data source)
#   /data/causal_dag_latest.json    — reconstructed DAG edges
#   /data/prov_agent_export.json    — grouped PROV-AGENT export
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spectra-pipeline
  namespace: openlit-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spectra
  template:
    metadata:
      labels:
        app: spectra
    spec:
      containers:
        - name: spectra-pipeline
          image: python:3.11-slim
          command: ["/bin/sh", "-c"]
          args:
            - |
              pip install --no-cache-dir \
                fastapi uvicorn \
                langgraph langchain-core langchain-openai langchain-ollama \
                langchain-community \
                "flowcept[llm_agent,mongo,extras]" \
                pymongo redis pdfplumber wordninja \
                pypdf requests prov rdflib opentelemetry-sdk \
                opentelemetry-exporter-otlp openlit \
                pdfminer.six

              # ── Write Flowcept settings ──────────────────────────────────
              mkdir -p /root/.flowcept
              cp /config/settings.yaml /root/.flowcept/settings.yaml

              # ── Pull tinyllama if not already present ────────────────────
              echo "Pulling tinyllama model (first run only)..."
              python3 -c "
              import requests, time
              for i in range(30):
                  try:
                      r = requests.post('http://ollama.openlit-demo.svc.cluster.local:11434/api/pull',
                                        json={'name':'tinyllama','stream':False}, timeout=600)
                      print('Mistral pull status:', r.status_code)
                      break
                  except Exception as e:
                      print(f'Waiting for Ollama ({i}):', e)
                      time.sleep(10)
              "

              # ── Write the dual-layer pipeline application ────────────────
              cat <<'PYEOF' > /app.py
              import os, sys, json, time, uuid
              import re, inspect
              from datetime import datetime
              from typing import TypedDict
              from pathlib import Path
              from fastapi import FastAPI, BackgroundTasks
              from fastapi.responses import JSONResponse
              import uvicorn

              # ── OTel / OpenLIT ───────────────────────────────────────────
              os.environ["OTEL_SERVICE_NAME"] = "spectra-pipeline"
              os.environ["OPENLIT_APPLICATION_NAME"] = "spectra-demo"
              try:
                  import openlit
                  openlit.init()
              except Exception:
                  pass

              # ── Flowcept imports ─────────────────────────────────────────
              from flowcept import Flowcept
              from flowcept.instrumentation.flowcept_decorator import flowcept
              from flowcept.instrumentation.flowcept_agent_task import (
                  agent_flowcept_task, FlowceptLLM, get_current_context_task
              )

              # ── LangGraph / LangChain ────────────────────────────────────
              from langgraph.graph import StateGraph, END
              from langchain_ollama import OllamaLLM
              from langchain_openai import ChatOpenAI

              OLLAMA_HOST = os.getenv("OLLAMA_HOST", "http://ollama:11434")
              DATA_DIR    = Path("/data")
              DATA_DIR.mkdir(exist_ok=True)
              JSONL_PATH  = DATA_DIR / "flowcept_buffer.jsonl"

              app = FastAPI(title="SPECTRA Dual-Layer Pipeline")
              _last_run = {"status": "idle", "run_id": None, "summary": {}}

              # ────────────────────────────────────────────────────────────
              # LAYER 2 — TraceCollector (Semantic Causal DAG)
              # Fires from inside the LLM reasoning loop.
              # ────────────────────────────────────────────────────────────
              class TraceCollector:
                  def __init__(self):
                      self.events = []
                      self.correlation_context = {}

                  def set_correlation(self, cid: str):
                      self.correlation_context["current"] = cid

                  def emit(self, event_type: str, agent_id: str, payload: dict) -> str:
                      event = {
                          "event_id":       str(uuid.uuid4()),
                          "event_type":     event_type,
                          "agent_id":       agent_id,
                          "timestamp":      time.time(),
                          "correlation_id": self.correlation_context.get("current", ""),
                          "payload":        payload,
                      }
                      self.events.append(event)
                      return event["event_id"]

                  def get_events(self): return self.events
                  def clear(self): self.events = []

              _collector = TraceCollector()
              def get_collector(): return _collector

              # ────────────────────────────────────────────────────────────
              # DAGBuilder — three-rule causal DAG reconstruction
              # ────────────────────────────────────────────────────────────
              class CausalEdge:
                  def __init__(self, from_id, to_id, reason, from_agent, to_agent):
                      self.from_event_id = from_id
                      self.to_event_id   = to_id
                      self.reason        = reason
                      self.from_agent    = from_agent
                      self.to_agent      = to_agent

              class CausalDAG:
                  def __init__(self, events):
                      self.events       = events
                      self.edges        = set()
                      self.edge_details = {}

                  def add_edge(self, from_id, to_id, reason, from_agent, to_agent):
                      self.edges.add((from_id, to_id))
                      self.edge_details[(from_id, to_id)] = CausalEdge(
                          from_id, to_id, reason, from_agent, to_agent)

                  def to_dict(self):
                      edges_list = []
                      for (fid, tid) in self.edges:
                          e = self.edge_details.get((fid, tid))
                          edges_list.append({
                              "from_event_id": fid, "to_event_id": tid,
                              "reason":     e.reason     if e else "unknown",
                              "from_agent": e.from_agent if e else "?",
                              "to_agent":   e.to_agent   if e else "?",
                          })
                      return {"num_events": len(self.events),
                              "num_edges":  len(self.edges),
                              "edges":      edges_list}

              class DAGBuilder:
                  def build(self, events):
                      dag = CausalDAG(events=events)
                      self._delegation_rule(dag)
                      self._intra_agent_rule(dag)
                      self._gap_completion(dag)
                      return dag

                  def _delegation_rule(self, dag):
                      for ev in dag.events:
                          if ev["event_type"] != "GOAL_DELEGATED": continue
                          to_agent = ev["payload"].get("to")
                          t0       = ev["timestamp"]
                          targets  = [e for e in dag.events
                                      if e["agent_id"] == to_agent and e["timestamp"] > t0]
                          if targets:
                              nxt = min(targets, key=lambda x: x["timestamp"])
                              dag.add_edge(ev["event_id"], nxt["event_id"],
                                           "delegation", ev["agent_id"], to_agent)

                  def _intra_agent_rule(self, dag):
                      by_agent = {}
                      for ev in dag.events:
                          by_agent.setdefault(ev["agent_id"], []).append(ev)
                      for agent, evs in by_agent.items():
                          sorted_evs = sorted(evs, key=lambda x: x["timestamp"])
                          for i in range(len(sorted_evs) - 1):
                              cur, nxt = sorted_evs[i], sorted_evs[i+1]
                              if (cur["event_id"], nxt["event_id"]) in dag.edges:
                                  continue
                              dag.add_edge(cur["event_id"], nxt["event_id"],
                                           "intra_agent_sequence", agent, agent)

                  def _gap_completion(self, dag):
                      by_agent = {}
                      for ev in dag.events:
                          by_agent.setdefault(ev["agent_id"], []).append(ev)
                      for agent, evs in by_agent.items():
                          sorted_evs = sorted(evs, key=lambda x: x["timestamp"])
                          for i in range(len(sorted_evs) - 1):
                              cur, nxt = sorted_evs[i], sorted_evs[i+1]
                              if (cur["event_id"], nxt["event_id"]) not in dag.edges:
                                  if nxt["timestamp"] - cur["timestamp"] < 0.01:
                                      dag.add_edge(cur["event_id"], nxt["event_id"],
                                                   "inferred_by_proximity", agent, agent)

              # ────────────────────────────────────────────────────────────
              # MistralAgent — Layer 2 instrumented LLM agent
              # ────────────────────────────────────────────────────────────
              class MistralAgent:
                  def __init__(self, agent_id, role):
                      self.agent_id = agent_id
                      self.role     = role
                      self.tools    = []
                      self.llm      = OllamaLLM(
                          model="tinyllama",
                          base_url=OLLAMA_HOST,
                          temperature=0,
                      )

                  def register_tool(self, tool_func):
                      self.tools.append(tool_func)

                  def _build_prompt(self):
                      lines = []
                      for t in self.tools:
                          inp = f" | inputs: {', '.join(t.inputs)}" if getattr(t,"inputs",None) else ""
                          lines.append(f"- {t.name}: {t.description}{inp}")
                      tools_str = "\n".join(lines) or "None"
                      return (
                          f"You are {self.agent_id}, a {self.role} agent.\n"
                          f"Available tools:\n{tools_str}\n\n"
                          "STRICT MODE: ONLY decide which tool to use.\n"
                          "Format EXACTLY as:\nTOOL_NAME: <name>\nPARAM_<input>: <value>\n"
                          "If no tool needed, reply: NO_TOOL"
                      )

                  def _parse_tool(self, response):
                      lines = response.split("\n")
                      tool_name, params, in_block = None, {}, False
                      for line in lines:
                          if "TOOL_NAME:" in line:
                              if in_block: break
                              tool_name = line.split("TOOL_NAME:")[1].strip()
                              in_block  = True
                          elif in_block and "PARAM_" in line:
                              m = re.match(r"PARAM_(\w+):\s*(.*)", line)
                              if m: params[m.group(1)] = m.group(2).strip()
                      return tool_name, params

                  def reason_and_act(self, state, goal):
                      col = get_collector()
                      try:
                          t0       = time.time()
                          response = self.llm.invoke(self._build_prompt() + f"\n\nTask: {goal}\n\nWhat should you do?")
                          latency  = time.time() - t0
                          reasoning = response.strip() if isinstance(response, str) else str(response)
                          tool_name, params = self._parse_tool(reasoning)
                      except Exception as e:
                          col.emit("GOAL_CREATED",  self.agent_id, {"goal": goal})
                          col.emit("REASONING_STEP",self.agent_id, {"step": "llm_error"})
                          col.emit("GOAL_FAILED",   self.agent_id, {"reason": "llm_error", "error": str(e)})
                          state["error"] = str(e)
                          return state

                      col.emit("GOAL_CREATED",  self.agent_id, {
                          "goal": goal, "role": self.role,
                          "tools_available": [t.name for t in self.tools],
                      })
                      col.emit("REASONING_STEP", self.agent_id, {
                          "step": "tool_selected",
                          "tool": tool_name or "NO_TOOL",
                          "reasoning": reasoning[:200],
                          "llm_latency_s": round(latency, 2),
                      })

                      if not tool_name or tool_name == "NO_TOOL":
                          col.emit("GOAL_COMPLETED", self.agent_id,
                                   {"result": "NO_TOOL", "tool_used": None, "status": "success"})
                          return state

                      tool = next((t for t in self.tools if t.name == tool_name), None)
                      if not tool:
                          col.emit("GOAL_FAILED", self.agent_id, {
                              "reason": "tool_not_found",
                              "requested_tool": tool_name,
                              "available_tools": [t.name for t in self.tools],
                          })
                          return state

                      col.emit("TOOL_INVOKED", self.agent_id, {
                          "tool": tool.name, "params": params, "reasoning": reasoning[:200]
                      })
                      try:
                          sig = inspect.signature(tool.func)
                          for name in sig.parameters:
                              if name not in params and name in state:
                                  params[name] = state[name]
                          result = tool.func(**params)
                          state["tool_result"] = result

                          failed = (
                              (isinstance(result, dict) and result.get("status") == "error")
                              or (isinstance(result, dict) and result.get("validation_failed"))
                              or (isinstance(result, str) and result.startswith("Tool execution failed:"))
                          )
                          if failed:
                              err = result.get("message") or result.get("error") or str(result) if isinstance(result, dict) else result
                              col.emit("GOAL_FAILED", self.agent_id, {
                                  "reason": "tool_execution_error", "tool": tool_name, "error": err
                              })
                              state["error"] = err
                              return state

                          col.emit("REASONING_STEP", self.agent_id, {
                              "step": "process_result", "tool": tool_name,
                              "result_length": len(str(result))
                          })
                          col.emit("GOAL_COMPLETED", self.agent_id, {
                              "result": str(result)[:100], "tool_used": tool_name, "status": "success"
                          })
                      except Exception as e:
                          col.emit("GOAL_FAILED", self.agent_id, {
                              "reason": "tool_execution_error", "tool": tool_name, "error": str(e)
                          })
                          state["error"] = str(e)
                      return state

              # ────────────────────────────────────────────────────────────
              # SimpleTool wrapper
              # ────────────────────────────────────────────────────────────
              class SimpleTool:
                  def __init__(self, name, description, func, inputs):
                      self.name        = name
                      self.description = description
                      self.func        = func
                      self.inputs      = inputs

              # ────────────────────────────────────────────────────────────
              # Pure tool functions (no LLM, no Flowcept)
              # ────────────────────────────────────────────────────────────
              def ingest_document(document: str = "sample document") -> dict:
                  """Parse real document text into structured paper metadata."""
                  import re as _re
                  text  = document.strip()
                  lines = [l.strip() for l in text.split("\n") if l.strip()]
                  # Title: first plausible line (10–200 chars, not all caps header)
                  title_cands = [l for l in lines[:12] if 10 < len(l) < 200 and not l.isupper()]
                  title = title_cands[0] if title_cands else "Unknown Title"
                  # Abstract: text between "Abstract" marker and first section heading
                  abstract = ""
                  abs_m = _re.search(
                      r"(?:abstract|Abstract)[:\s\-]+(.*?)(?=\n\s*(?:1\.|I\.|introduction|keywords|index terms))",
                      text, _re.IGNORECASE | _re.DOTALL)
                  if abs_m:
                      abstract = abs_m.group(1).replace("\n", " ").strip()[:600]
                  if not abstract:
                      abstract = " ".join(lines[1:8])[:500]
                  # Keep full text for ref counting, truncate only for LLM prompts
                  full_text_for_refs = text
                  text_for_llm = text[:8000]
                  word_count = len(text.split())
                  pages      = max(1, word_count // 400)
                  year_m     = _re.search(r"\b(202[0-9]|201[5-9])\b", text)
                  year       = int(year_m.group(1)) if year_m else 2025
                  # Count references: try multiple formats
                  # IEEE [1], ACM [Smith2023], author-year, or numbered list "1."
                  ref_ieee   = len(set(_re.findall(r"\[\d+\]", full_text_for_refs)))
                  ref_acm    = len(set(_re.findall(r"\[[A-Z][a-z]+\d{2,4}\]", full_text_for_refs)))
                  ref_num    = len(set(_re.findall(r"(?:^|\n)\s{0,4}\d{1,3}\.\s+[A-Z]", full_text_for_refs)))
                  ref_count  = max(ref_ieee, ref_acm, ref_num)
                  # Fallback: estimate from "References" section length
                  if ref_count < 3:
                      ref_sec = _re.search(r"\breferences\b(.*?)$", full_text_for_refs, _re.IGNORECASE | _re.DOTALL)
                      if ref_sec:
                          ref_count = max(5, len(ref_sec.group(1).split("\n")) // 3)
                  return {
                      "title":      title[:200],
                      "abstract":   abstract,
                      "full_text":  text_for_llm[:5000],
                      "pages":      pages,
                      "year":       year,
                      "word_count": word_count,
                      "ref_count":  ref_count,
                  }

              def extract_findings(paper: dict = None) -> dict:
                  """Extract structured findings from real paper content."""
                  import re as _re
                  if not paper or isinstance(paper, str):
                      paper = {}
                  text = str(paper.get("full_text", "") or paper.get("abstract", ""))
                  # Extract contribution claim
                  c_m = _re.search(
                      r"(we present|we propose|we introduce|this paper|our approach|our system|we show)(.*?)[.!]",
                      text, _re.IGNORECASE)
                  contribution = c_m.group(0).strip()[:300] if c_m else \
                      paper.get("abstract", "no abstract found")[:300]
                  # Quantitative results
                  results = list(dict.fromkeys(_re.findall(r"\d+(?:\.\d+)?\s*%", text)))[:5]
                  # Key technical terms (uppercase multi-word)
                  terms = list(dict.fromkeys(
                      _re.findall(r"[A-Z][a-zA-Z]+(?:\s+[A-Z][a-zA-Z]+)+", text)))[:8]
                  ref_count    = paper.get("ref_count", 0)
                  impact_score = min(10.0, round(len(results) * 1.5 + min(ref_count / 5, 4.0), 1))
                  return {
                      "main_contribution":    contribution,
                      "quantitative_results": results,
                      "key_terms":            terms[:5],
                      "impact_score":         impact_score,
                      "ref_count":            ref_count,
                      "llm_findings":         "",
                  }

              def crashing_analysis_tool(paper=None, **kwargs):
                  """Deliberately fails — demonstrates GOAL_FAILED in Layer 2 while
                  Layer 1 shows FINISHED. Core SPECTRA teaching scenario: fallback runs,
                  impact score defaults to 0.0, single-layer tools see nothing wrong."""
                  return {
                      "status":  "error",
                      "message": "Impact database connection lost — fallback mode active",
                  }

              def validate_citations(paper: dict = None, sample_size: int = 5) -> dict:
                  """Validate citations extracted from real paper. Fails ~30% stochastically."""
                  import random, re as _re
                  if random.random() < 0.30:
                      return {
                          "validation_failed": True,
                          "error":             "Citation validation service timeout",
                          "total_citations":   0,
                          "validated":         0,
                          "validation_rate":   0.0,
                      }
                  text  = str((paper or {}).get("full_text", ""))
                  refs  = _re.findall(r"\[\d+\]", text)
                  total = len(set(refs)) or (paper.get("ref_count", 20) if paper else 20)
                  validated = int(total * random.uniform(0.88, 0.97))
                  issues = [f"[{i}] missing DOI" for i in
                            random.sample(range(1, total + 1),
                            min(total - validated, 3))] if total > validated else []
                  return {
                      "total_citations": total,
                      "validated":       validated,
                      "validation_rate": round(validated / max(total, 1), 3),
                      "issues":          issues,
                  }

              def synthesize_analysis(findings: dict = None, citations: dict = None) -> str:
                  """Build factual synthesis from real findings and citation results."""
                  def sd(v): return v if isinstance(v, dict) else {}
                  f, c    = sd(findings), sd(citations)
                  contrib = f.get("main_contribution", "unknown contribution")[:200]
                  results = ", ".join(f.get("quantitative_results", [])) or "no quantitative results"
                  cit_pct = f"{c.get('validation_rate', 0)*100:.0f}%" if c.get("validation_rate") else "N/A"
                  total   = c.get("total_citations", 0)
                  return (
                      f"Main contribution: {contrib}. "
                      f"Quantitative results: {results}. "
                      f"Citation quality: {cit_pct} of {total} citations validated."
                  )

              # ────────────────────────────────────────────────────────────
              # -- LAYER 1 -- @agent_flowcept_task decorated node functions
              # Each node calls the LLM directly for real content tasks,
              # then dispatches its tool deterministically.
              # Layer 2 TraceCollector fires from inside each node.
              # ----------------------------------------------------------------

              # thread-local storage so llm_call can find the current run_id + agent
              import threading as _threading
              _llm_ctx = _threading.local()

              def llm_call(prompt, system="", agent_id="unknown", run_id_ctx="", parent_task_id=""):
                  try:
                      t0  = time.time()
                      model_name = os.getenv("OLLAMA_MODEL", "tinyllama")
                      llm = OllamaLLM(model=model_name, base_url=OLLAMA_HOST, temperature=0)
                      full_prompt = (system + "\n\n" + prompt) if system else prompt
                      response    = llm.invoke(full_prompt)
                      latency     = round(time.time() - t0, 2)
                      result      = response.strip() if isinstance(response, str) else str(response)
                      print(f"[LLM] agent={agent_id} latency={latency}s len={len(result)}", flush=True)
                      # Save llm_task record (wasInformedBy layer)
                      save_layer1(
                          activity_id   = f"llm_{agent_id}",
                          agent         = agent_id,
                          run_id        = run_id_ctx,
                          used          = {"prompt": prompt[:300]},
                          generated     = {"response": result[:300]},
                          started_at    = t0,
                          ended_at      = t0 + latency,
                          status        = "FINISHED",
                          subtype       = "llm_task",
                          parent_id     = parent_task_id,
                      )
                      return result, latency
                  except Exception as e:
                      print(f"[LLM] error: {e}", flush=True)
                      return f"LLM error: {e}", 0.0

              _layer1_task_ids = {}  # agent_id -> task_id for wasInformedBy links

              def save_layer1(activity_id, agent, run_id, used, generated, started_at, ended_at, status="FINISHED", subtype="agent_task", parent_id=""):
                  """Write a Layer 1 record directly to MongoDB."""
                  try:
                      from pymongo import MongoClient
                      client = MongoClient("flowcept-mongodb", 27017)
                      db = client["flowcept"]
                      tid = str(uuid.uuid4())
                      record = {
                          "activity_id":     activity_id,
                          "task_id":         tid,
                          "workflow_id":     run_id,
                          "subtype":         subtype,
                          "custom_metadata": {"agent": agent, "framework": "spectra"},
                          "agent":           agent,
                          "used":            used,
                          "generated":       generated,
                          "started_at":      started_at,
                          "ended_at":        ended_at,
                          "status":          status,
                          "parent_task_id":  parent_id,
                      }
                      db["tasks"].insert_one(record)
                      client.close()
                      if subtype == "agent_task":
                          _layer1_task_ids[agent] = tid
                      print(f"[Layer1] Saved {activity_id} ({subtype}/{status})", flush=True)
                      return tid
                  except Exception as e:
                      print(f"[Layer1] Save failed: {e}", flush=True)
                      return ""

              def ingestion_node_task(state, run_id):
                  col = get_collector()
                  doc = state.get("document", "sample research document about AI observability")
                  col.emit("GOAL_CREATED", "ingestion_agent", {"goal": "Ingest and summarize", "role": "ingestion specialist"})
                  col.emit("REASONING_STEP", "ingestion_agent", {"step": "calling_llm"})
                  t0 = time.time()
                  agent_tid = save_layer1("ingestion_agent", "ingestion_agent", run_id, {"document": doc[:100]}, {}, t0, t0, status="RUNNING")
                  paper = ingest_document(doc)
                  ingest_prompt = (
                      f"You are a scientific analyst. Read this paper and write a precise 2-sentence summary:\n"
                      f"Title: {paper.get('title','unknown')}\n"
                      f"Abstract: {paper.get('abstract',doc[:300])}\n\n"
                      f"Write: (1) what problem it solves, (2) what method it proposes."
                  )
                  summary, latency = llm_call(ingest_prompt, system="Be precise and factual. Two sentences only.", agent_id="ingestion_agent", run_id_ctx=run_id, parent_task_id=agent_tid)
                  col.emit("TOOL_INVOKED", "ingestion_agent", {"tool": "ingest_document"})
                  paper["llm_summary"] = summary
                  col.emit("REASONING_STEP", "ingestion_agent", {"step": "process_result"})
                  col.emit("GOAL_COMPLETED", "ingestion_agent", {"result": summary[:80], "tool_used": "ingest_document", "status": "success"})
                  col.emit("GOAL_DELEGATED", "ingestion_agent", {"from": "ingestion_agent", "to": "analysis_agent", "task": "extract findings from ingested paper"})
                  save_layer1("ingestion_agent", "ingestion_agent", run_id, {"document": doc[:100]}, {"summary": summary[:200]}, t0, time.time())
                  state["paper"] = paper
                  state["paper_meta"] = paper
                  return state

              def analysis_node_task(state, run_id):
                  col   = get_collector()
                  paper = state.get("paper", {})
                  text  = paper.get("llm_summary", paper.get("full_text", "no content"))[:400]
                  col.emit("GOAL_CREATED", "analysis_agent", {"goal": "Extract key findings", "role": "research analyzer"})
                  col.emit("REASONING_STEP", "analysis_agent", {"step": "calling_llm"})
                  t0 = time.time()
                  agent_tid = save_layer1("analysis_agent", "analysis_agent", run_id, {"text": text[:100]}, {}, t0, t0, status="RUNNING")
                  findings = extract_findings(paper)
                  analysis_prompt = (
                      f"You are a research analyst. Based on this paper content, identify 3 key findings.\n"
                      f"Paper summary: {text}\n"
                      f"Known contribution: {findings.get('main_contribution','')[:200]}\n"
                      f"List exactly 3 numbered findings with brief evidence for each:"
                  )
                  findings_text, latency = llm_call(analysis_prompt, system="Be specific. Reference actual content from the paper.", agent_id="analysis_agent", run_id_ctx=run_id, parent_task_id=agent_tid)
                  col.emit("TOOL_INVOKED", "analysis_agent", {"tool": "extract_findings"})
                  findings["llm_findings"] = findings_text
                  col.emit("REASONING_STEP", "analysis_agent", {"step": "process_result"})
                  col.emit("GOAL_COMPLETED", "analysis_agent", {"result": findings_text[:80], "tool_used": "extract_findings", "status": "success"})
                  col.emit("GOAL_DELEGATED", "analysis_agent", {"from": "analysis_agent", "to": "impact_agent", "task": "calculate deep impact score"})
                  save_layer1("analysis_agent", "analysis_agent", run_id, {"text": text[:100]}, {"findings": findings_text[:200]}, t0, time.time())
                  state["analysis"] = findings
                  return state

              def impact_node_task(state, run_id):
                  col      = get_collector()
                  analysis = state.get("analysis", {})
                  col.emit("GOAL_CREATED", "impact_agent", {"goal": "Calculate impact score", "role": "impact specialist"})
                  col.emit("REASONING_STEP", "impact_agent", {"step": "calling_llm"})
                  t0 = time.time()
                  agent_tid = save_layer1("impact_agent", "impact_agent", run_id, {"analysis": str(analysis)[:100]}, {}, t0, t0, status="RUNNING")
                  impact_prompt = (
                      f"You are a research impact assessor. Rate the scientific impact 1-10.\n"
                      f"Contribution: {analysis.get('main_contribution',str(analysis)[:200])}\n"
                      f"Key findings: {analysis.get('llm_findings','')[:200]}\n"
                      f"Quantitative results: {analysis.get('quantitative_results',[])}\n\n"
                      f"Respond with: score (1-10), one sentence rationale."
                  )
                  impact_text, latency = llm_call(impact_prompt, system="Be specific about the contribution's novelty and significance.", agent_id="impact_agent", run_id_ctx=run_id, parent_task_id=agent_tid)
                  col.emit("TOOL_INVOKED", "impact_agent", {"tool": "calculate_deep_impact", "reasoning": impact_text[:80]})
                  result = crashing_analysis_tool()
                  col.emit("GOAL_FAILED", "impact_agent", {"reason": "tool_execution_error", "tool": "calculate_deep_impact", "error": result.get("message","error")})
                  # Layer 1: FINISHED despite tool failure (fallback ran)
                  save_layer1("impact_agent", "impact_agent", run_id, {"analysis": str(analysis)[:100]}, {"llm_assessment": impact_text[:200], "fallback": True}, t0, time.time(), status="FINISHED")
                  col.emit("GOAL_DELEGATED", "impact_agent", {"from": "impact_agent", "to": "citation_agent", "task": "validate citations (fallback after impact failure)"})
                  state["impact"] = {"impact_score": 0.0, "fallback": True, "llm_assessment": impact_text}
                  return state

              def citation_node_task(state, run_id):
                  col   = get_collector()
                  paper = state.get("paper", {})
                  col.emit("GOAL_CREATED", "citation_agent", {"goal": "Validate citations", "role": "citation validator"})
                  col.emit("REASONING_STEP", "citation_agent", {"step": "calling_llm"})
                  t0 = time.time()
                  agent_tid = save_layer1("citation_agent", "citation_agent", run_id, {"paper_summary": paper.get("llm_summary","")[:100]}, {}, t0, t0, status="RUNNING")
                  cit_prompt = (
                      f"You are a citation quality expert. Assess the citation practices.\n"
                      f"Paper: {paper.get('title','unknown')} ({paper.get('year','n/a')})\n"
                      f"Reference count: {paper.get('ref_count',0)}\n"
                      f"Summary: {paper.get('llm_summary',paper.get('abstract',''))[:200]}\n\n"
                      f"Comment on: (1) citation density, (2) likely recency, (3) overall quality."
                  )
                  cit_text, latency = llm_call(cit_prompt, system="Be specific. One paragraph.", agent_id="citation_agent", run_id_ctx=run_id, parent_task_id=agent_tid)
                  col.emit("TOOL_INVOKED", "citation_agent", {"tool": "validate_citations"})
                  result = validate_citations(paper, sample_size=5)
                  if result.get("validation_failed"):
                      col.emit("GOAL_FAILED", "citation_agent", {"reason": "tool_execution_error", "tool": "validate_citations", "error": result.get("error","timeout")})
                      col.emit("GOAL_DELEGATED", "citation_agent", {"from": "citation_agent", "to": "synthesis_agent", "task": "synthesize (citation failed)"})
                      save_layer1("citation_agent", "citation_agent", run_id, {"paper_summary": paper.get("llm_summary","")[:100]}, {"error": result.get("error","")}, t0, time.time(), status="ERROR")
                      state["citation_failed"] = True
                      state["citation_error"]  = result.get("error")
                  else:
                      col.emit("REASONING_STEP", "citation_agent", {"step": "process_result"})
                      col.emit("GOAL_COMPLETED", "citation_agent", {"result": f"validated {result.get('validated',0)}", "tool_used": "validate_citations", "status": "success"})
                      col.emit("GOAL_DELEGATED", "citation_agent", {"from": "citation_agent", "to": "synthesis_agent", "task": "synthesize findings and citations"})
                      save_layer1("citation_agent", "citation_agent", run_id, {"paper_summary": paper.get("llm_summary","")[:100]}, {"validated": result.get("validated",0), "llm_comment": cit_text[:200]}, t0, time.time())
                      state["citations"] = result
                  return state

              def synthesis_node_task(state, run_id):
                  col      = get_collector()
                  analysis = state.get("analysis", {})
                  citations= state.get("citations", {})
                  col.emit("GOAL_CREATED", "synthesis_agent", {"goal": "Write final synthesis", "role": "synthesis specialist"})
                  col.emit("REASONING_STEP", "synthesis_agent", {"step": "calling_llm"})
                  t0 = time.time()
                  agent_tid = save_layer1("synthesis_agent", "synthesis_agent", run_id, {"analysis": str(analysis)[:100]}, {}, t0, t0, status="RUNNING")
                  synth_prompt = (
                      f"You are a scientific writer. Write a 3-sentence synthesis for a paper review.\n"
                      f"Paper: {state.get('paper',{}).get('title','unknown')}\n"
                      f"Main contribution: {analysis.get('main_contribution','')[:200]}\n"
                      f"Key findings: {analysis.get('llm_findings','')[:200]}\n"
                      f"Impact assessment: {state.get('impact',{}).get('llm_assessment','')[:100]}\n"
                      f"Citations: {citations.get('validated',0)}/{citations.get('total_citations',0)} validated\n\n"
                      f"Write exactly 3 sentences: (1) contribution, (2) findings, (3) significance."
                  )
                  llm_synthesis, latency = llm_call(
                      synth_prompt,
                      system="Be specific, factual, and grounded in the paper content provided.",
                      agent_id="synthesis_agent", run_id_ctx=run_id, parent_task_id=agent_tid
                  )
                  col.emit("TOOL_INVOKED", "synthesis_agent", {"tool": "synthesize"})
                  tool_synthesis = synthesize_analysis(analysis, citations)
                  col.emit("REASONING_STEP", "synthesis_agent", {"step": "process_result"})
                  col.emit("GOAL_COMPLETED", "synthesis_agent", {"result": llm_synthesis[:80], "tool_used": "synthesize", "status": "success"})
                  save_layer1("synthesis_agent", "synthesis_agent", run_id, {"analysis": str(analysis)[:150], "title": state.get("paper",{}).get("title","")[:100]}, {"synthesis": str(llm_synthesis or tool_synthesis)[:500]}, t0, time.time())
                  state["synthesis"] = llm_synthesis or tool_synthesis
                  return state

              # ────────────────────────────────────────────────────────────
              # LangGraph wiring
              # ────────────────────────────────────────────────────────────
              class PipelineState(TypedDict, total=False):
                  document:       str
                  run_id:         str
                  paper:          dict
                  paper_meta:     dict
                  analysis:       dict
                  impact:         dict
                  citations:      dict
                  synthesis:      str
                  error:          str
                  citation_failed:bool
                  citation_error: str

              def build_pipeline():
                  g = StateGraph(PipelineState)

                  def ingestion(state):
                      return ingestion_node_task(state, state.get("run_id",""))
                  def analysis(state):
                      return analysis_node_task(state, state.get("run_id",""))
                  def impact(state):
                      return impact_node_task(state, state.get("run_id",""))
                  def citation(state):
                      return citation_node_task(state, state.get("run_id",""))
                  def synthesis(state):
                      return synthesis_node_task(state, state.get("run_id",""))

                  g.add_node("ingestion", ingestion)
                  g.add_node("analysis",  analysis)
                  g.add_node("impact",    impact)
                  g.add_node("citation",  citation)
                  g.add_node("synthesis", synthesis)

                  g.add_edge("ingestion", "analysis")
                  g.add_edge("analysis",  "impact")
                  g.add_edge("impact",    "citation")
                  g.add_edge("citation",  "synthesis")
                  g.add_edge("synthesis", END)

                  g.set_entry_point("ingestion")
                  return g.compile()

              # ────────────────────────────────────────────────────────────
              # Run function — orchestrates both layers
              # ────────────────────────────────────────────────────────────
              def run_pipeline(document: str = "sample research document"):
                  run_id  = str(uuid.uuid4())[:8]
                  col     = get_collector()
                  col.clear()
                  col.set_correlation(run_id)

                  print(f"[SPECTRA] Starting run {run_id}", flush=True)
                  pipeline = build_pipeline()

                  try:
                      final_state = pipeline.invoke({
                          "document": document,
                          "run_id":   run_id,
                      })
                  except Exception as e:
                      print(f"[SPECTRA] Pipeline error: {e}", flush=True)
                      final_state = {"error": str(e)}

                  # ── Reconstruct causal DAG (Layer 2) ────────────────────
                  events = col.get_events()
                  dag    = DAGBuilder().build(events)

                  print(f"[SPECTRA] Layer 2: {len(events)} events, {len(dag.edges)} causal edges", flush=True)

                  # -- Read Layer 1 records from MongoDB (written by save_layer1()) -
                  flowcept_records = []
                  try:
                      from pymongo import MongoClient as _MC
                      _mc = _MC("flowcept-mongodb", 27017)
                      _db = _mc["flowcept"]
                      flowcept_records = list(_db["tasks"].find(
                          {"workflow_id": run_id, "custom_metadata.framework": "spectra"},
                          {"_id": 0}
                      ))
                      _mc.close()
                      print(f"[Layer1] Read {len(flowcept_records)} records from MongoDB for run {run_id}", flush=True)
                  except Exception as e:
                      print(f"[Layer1] MongoDB read failed: {e}", flush=True)

                  # ── Write JSONL for GUI ──────────────────────────────────
                  with open(JSONL_PATH, "w") as f:
                      for rec in flowcept_records:
                          rec["custom_metadata"] = rec.get("custom_metadata") or {}
                          rec["custom_metadata"]["framework"] = "spectra"
                          f.write(json.dumps(rec) + "\n")

                  # ── Write DAG JSON ───────────────────────────────────────
                  dag_dict = dag.to_dict()
                  # Annotate edges with event payloads for richer GUI display
                  event_map = {ev["event_id"]: ev for ev in events}
                  for edge in dag_dict["edges"]:
                      fev = event_map.get(edge["from_event_id"], {})
                      tev = event_map.get(edge["to_event_id"], {})
                      edge["from_type"] = fev.get("event_type", "?")
                      edge["to_type"]   = tev.get("event_type", "?")
                  dag_dict["events_detail"] = [
                      {
                          "event_id":   ev["event_id"],
                          "event_type": ev["event_type"],
                          "agent_id":   ev["agent_id"],
                          "timestamp":  ev["timestamp"],
                          "payload":    ev.get("payload", {}),
                      } for ev in events
                  ]
                  with open(DATA_DIR / "causal_dag_latest.json", "w") as f:
                      json.dump(dag_dict, f, indent=2)

                  # ── Summary ──────────────────────────────────────────────
                  goal_failed = [ev for ev in events if ev["event_type"] == "GOAL_FAILED"]
                  summary = {
                      "run_id":          run_id,
                      "timestamp":       datetime.now().isoformat(),
                      "layer1_records":  len(flowcept_records),
                      "layer2_events":   len(events),
                      "causal_edges":    len(dag.edges),
                      "goal_failed":     len(goal_failed),
                      "goal_failed_agents": list({ev["agent_id"] for ev in goal_failed}),
                      "dual_layer_contrast": len(goal_failed) > 0,
                      "synthesis":       str(final_state.get("synthesis",""))[:400],
                      "paper_title":     str((final_state.get("paper") or {}).get("title",""))[:150],
                      "paper_year":      (final_state.get("paper") or {}).get("year",""),
                      "ref_count":       (final_state.get("paper") or {}).get("ref_count",0),
                  }
                  print(f"[SPECTRA] Run complete: {json.dumps(summary)}", flush=True)
                  return summary

              # ────────────────────────────────────────────────────────────
              # FastAPI endpoints
              # ────────────────────────────────────────────────────────────
              @app.get("/run")
              def trigger_run(document: str = "sample research document about AI observability",
                              pdf: str = ""):
                  """Trigger a SPECTRA pipeline run.
                  Args:
                    document: text to analyse (used if no pdf provided)
                    pdf: path to a PDF file inside the container (optional)
                         Upload a PDF to /data/paper.pdf via:
                         kubectl cp paper.pdf openlit-demo/<pod>:/data/paper.pdf
                  """
                  global _last_run
                  # If PDF path provided, read it
                  if pdf:
                      try:
                          import pdfplumber
                          with pdfplumber.open(pdf) as p:
                              pages_text = []
                              for page in p.pages:
                                  t = page.extract_text()
                                  if t: pages_text.append(t)
                          full_pdf_text = "\n".join(pages_text)
                          # Pass full text to ingest_document for accurate ref counting
                          # LLM prompts use first 8000 chars; ref detection uses full text
                          document = full_pdf_text  # no truncation here — ingest_document handles it
                          print(f"[SPECTRA] PDF loaded: {pdf}, {len(full_pdf_text)} total chars", flush=True)
                      except Exception as e:
                          print(f"[SPECTRA] PDF read failed: {e}, using text document", flush=True)
                  # Check Ollama is reachable before starting
                  import requests as _req
                  ollama_url = os.getenv("OLLAMA_HOST", "http://ollama.openlit-demo.svc.cluster.local:11434")
                  for attempt in range(10):
                      try:
                          _req.get(f"{ollama_url}/api/tags", timeout=5)
                          break
                      except Exception as e:
                          print(f"[SPECTRA] Waiting for Ollama (attempt {attempt+1}/10): {e}", flush=True)
                          time.sleep(6)
                  else:
                      return JSONResponse(status_code=503, content={"error": "Ollama not reachable. Is it running? Try: kubectl get pods -n openlit-demo -l app=ollama"})
                  try:
                      summary = run_pipeline(document)
                      _last_run = {"status": "ok", "run_id": summary["run_id"], "summary": summary}
                      return _last_run
                  except Exception as e:
                      _last_run = {"status": "error", "error": str(e)}
                      return JSONResponse(status_code=500, content=_last_run)

              @app.get("/run/status")
              def run_status():
                  return _last_run

              @app.get("/health")
              def health():
                  return {"status": "ok", "framework": "spectra"}

              @app.get("/dag")
              def get_dag():
                  p = DATA_DIR / "causal_dag_latest.json"
                  if p.exists():
                      return json.loads(p.read_text())
                  return {"error": "no dag yet — trigger /run first"}

              if __name__ == "__main__":
                  uvicorn.run(app, host="0.0.0.0", port=8000)
              PYEOF

