# =============================================================================
# MULTI-AGENT OBSERVABILITY DEMO — SPECTRA Edition  (namespace: openlit-demo)
# Stack: OpenLIT · Jaeger · Prometheus · Grafana · Langfuse · Phoenix · Flowcept · SPECTRA
#
# WHAT THIS FILE DEPLOYS
#   spectra-pipeline   — Dual-layer LangGraph research pipeline (5 nodes)
#                        Layer 1: PROV-AGENT via Flowcept decorators
#                        Layer 2: Semantic Causal DAG via TraceCollector
#   spectra-gui        — Streamlit provenance viewer (4 tabs: Prov Graph,
#                        Causal DAG, Hallucination Report, Provenance Chat)
#   spectra-data       — Shared /data volume (emptyDir) between pipeline + GUI.
#                        NOTE: emptyDir is WIPED on pod restart, so after any
#                        restart the GUI shows no DAG until you trigger one run
#                        (which rewrites /data/causal_dag_latest.json).
#
# PREREQUISITE
#   The base stack must already be deployed — deploy/local-k3s/demo_test.yaml
#   (laptop CPU) or deploy/robopaas/demo_test_robopaas.yaml (GPU) — which
#   provides: otel-collector, flowcept-redis, flowcept-mongodb,
#   flowcept-consumer, flowcept-rest, and ollama.
#   Extra models are pulled on first use (a few minutes the first time).
#
# WHAT SPECTRA ADDS BEYOND THE OTHER TWO DEMOS
#
#   The base demo (demo_test.yaml) and LangGraph demo (demo_langgraph.yaml)
#   use a single Flowcept layer: each node emits one task record with
#   started_at, ended_at, used, generated — the PROV-AGENT accountability layer.
#
#   SPECTRA runs TWO layers simultaneously:
#
#   Layer 1 — PROV-AGENT (accountability):  @agent_flowcept_task + FlowceptLLM
#     Records: AgentTool (one per node) + AIModelInvocation (one per LLM call)
#     Linked by wasInformedBy (parent_task_id)
#     Answers: what ran? what did Mistral say? can I trace output to LLM call?
#
#   Layer 2 — Semantic Causal DAG (reasoning):  TraceCollector inside LLM loop
#     Events: GOAL_CREATED · REASONING_STEP · TOOL_INVOKED · GOAL_COMPLETED
#             GOAL_FAILED
#     Reconstructed by DAGBuilder using 3 rules (delegation, intra-agent, gap)
#     Answers: did the LLM reason correctly? where did a failure originate?
#              is the pipeline robust or just lucky?
#
#   THE KEY FINDING — the contrast between layers:
#     Layer 1 shows all nodes FINISHED (function returned normally)
#     Layer 2 shows GOAL_FAILED for impact_agent (LLM chose wrong tool)
#     Both are correct simultaneously — the pipeline succeeded via fallback
#     compensation, not via correct Mistral reasoning. This is invisible to
#     any single-layer observability tool.
#
# GRAPH TOPOLOGY (5-node research paper analysis pipeline)
#
#   ingestion_agent  →  analysis_agent  →  impact_agent  (deliberately fails)
#                                        ↓
#                                   citation_agent  (fails ~30%)
#                                        ↓
#                                   synthesis_agent
#
# PORT-FORWARDS REQUIRED
#
#   — From demo_test.yaml (must already be running) —
#   kubectl port-forward svc/flowcept-rest  -n openlit-demo 5000:5000
#   kubectl port-forward svc/ollama         -n openlit-demo 11434:11434
#
#   — From this file —
#   kubectl port-forward svc/spectra-gui    -n openlit-demo 8501:8501
#
#   — Optional shared backends —
#   kubectl port-forward svc/jaeger         -n openlit-demo 16686:16686
#   kubectl port-forward svc/openlit        -n openlit      3000:3000
#   kubectl port-forward svc/langfuse-web   -n langfuse     3002:3000
#
# QUICK START
#   1. Ensure demo_test.yaml is deployed and its port-forwards are running
#   2. kubectl apply -f demo_spectra.yaml
#   3. Wait ~5 min for pip install + mistral pull (first time only)
#   4. kubectl port-forward svc/spectra-gui -n openlit-demo 8501:8501
#   5. Trigger a run:
#        curl http://localhost:8502/run        # triggers pipeline, writes JSONL
#   6. Open GUI: http://localhost:8501
#      Tab 1 — Provenance Graph: all nodes FINISHED (accountability layer)
#      Tab 2 — Causal DAG: GOAL_FAILED visible for impact_agent (reasoning layer)
#      Tab 3 — Hallucination Report: confidence scores per AgentTool
#      Tab 4 — Provenance Chat: natural-language queries over Flowcept records
#
# REDEPLOYMENT
#   kubectl apply -f demo_spectra.yaml
#   kubectl rollout restart deployment/spectra-pipeline deployment/spectra-gui \
#     -n openlit-demo
#   # Clear SPECTRA provenance only:
#   kubectl exec -n openlit-demo deployment/flowcept-mongodb -- \
#     mongosh flowcept --eval "db.tasks.deleteMany({'custom_metadata.framework':'spectra'})"
#   # Clear JSONL buffer:
#   kubectl exec -n openlit-demo deployment/spectra-pipeline -- \
#     sh -c "echo '' > /data/flowcept_buffer.jsonl"
#
# COMPARISON WITH THE OTHER TWO DEMOS
#
#   demo_test.yaml      — 3-agent linear pipeline (agent-a→b→c)
#                         Single Flowcept layer, manual emit()
#                         Flowcept UI at port 8020
#
#   demo_langgraph.yaml — 5-node LangGraph graph with revision cycles
#                         Single Flowcept layer, manual emit() per node
#                         LangGraph UI at port 8021
#
#   demo_spectra.yaml   — 5-node LangGraph graph with deliberate failures
#                         DUAL Flowcept layer: @agent_flowcept_task + TraceCollector
#                         SPECTRA GUI (Streamlit) at port 8501
#                         Unique capability: contrast between accountability
#                         and reasoning layers reveals hidden fragility
# =============================================================================

---
