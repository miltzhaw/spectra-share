# =============================================================================
# SETUP GUIDE — at the bottom for reference
# =============================================================================
#
# WHAT SPECTRA ADDS THAT THE OTHER DEMOS DON'T
#
#   The core finding SPECTRA makes visible:
#
#   impact_agent always shows FINISHED in Layer 1 (PROV-AGENT / Flowcept).
#   But in Layer 2 (Causal DAG), it shows:
#     GOAL_CREATED → REASONING_STEP → TOOL_INVOKED → GOAL_FAILED
#
#   This is because:
#   - The Python function always returns normally (fallback runs regardless)
#   - @agent_flowcept_task records the Python function outcome → FINISHED
#   - TraceCollector fires INSIDE the LLM loop, BEFORE the fallback
#   - It records that the LLM's chosen tool (calculate_deep_impact)
#     returned {"status": "error", ...}
#
#   The gap between layers = the pipeline's hidden fragility.
#   Without Layer 2, you would believe impact_agent is working correctly.
#   With Layer 2, you see it fails every time and the pipeline compensates.
#
# ABLATION STUDY (observable in the lab)
#
#   Full instrumentation:          ~24 events, ~19 causal edges, 100% accuracy
#   Without GOAL_DELEGATED events: ~17 events,  ~4 causal edges,  25% accuracy
#   Without REASONING_STEP events:  ~2 events,   ~1 causal edge,   0% accuracy
#
#   Students can reproduce this by commenting out collector.emit() calls
#   for specific event types in the pipeline pod and comparing DAG outputs.
#
# COMPARISON TABLE (for the lab report)
#
#   Capability                    demo_test  demo_langgraph  demo_spectra
#   ─────────────────────────────────────────────────────────────────────
#   W3C PROV records              ✅ manual  ✅ manual       ✅ @decorator
#   LLM call linked to node       ❌         ❌              ✅ wasInformedBy
#   Revision cycles visible       ❌         ✅              ❌
#   Fallback compensation visible ❌         ❌              ✅ dual-layer
#   LLM reasoning trace           ❌         ❌              ✅ TraceCollector
#   GOAL_FAILED vs FINISHED gap   ❌         ❌              ✅
#   Causal DAG reconstruction     ❌         ❌              ✅ DAGBuilder
#   Streamlit GUI                 ❌         ❌              ✅
#   Hallucination report          ❌         ❌              ✅
# =============================================================================
